function foodResults() {
  const q = S.foodQuery.trim().toLowerCase(), s = settings();
  const row = f => { const n = Calc.scaleFood(f, f.portions.medium); return `<div class="item"><div class="in" data-act="pickFood" data-id="${esc(f.id)}"><span style="min-width:0"><b>${esc(f.name)}</b><br><span class="small muted">${r0(n.kcal)} kcal · P ${r0(n.protein)} · C ${r0(n.carbs)} · F ${r0(n.fat)} · medium ${f.portions.medium} g</span></span><button data-act="favFood" data-id="${esc(f.id)}" aria-label="Favorite" style="background:none;border:0">${s.favFoods.includes(f.id) ? '⭐' : '☆'}</button></div></div>`; };
  if (S.addTab === 'meals') {
    const m = Store.list('savedMeals');
    return m.length ? m.map(x => `<div class="item" data-del="meal:${x.id}"><div class="in" data-act="logMeal" data-id="${x.id}"><span><b>${esc(x.name)}</b><br><span class="small muted">${x.items.length} items · ${r0(x.items.reduce((a, i) => a + i.kcal, 0))} kcal</span></span><span class="small muted">tap to add</span></div></div>`).join('') + '<p class="tiny muted">Swipe left to delete a saved meal.</p>'
      : `<div class="empty small">No saved meals yet. In the Food screen, tap “Save meal” on a meal to reuse it later.</div>`;
  }
  let list = allFoods();
  if (S.addTab === 'fav') list = s.favFoods.map(foodById).filter(Boolean);
  if (S.addTab === 'recent') { const seen = new Set(), out = []; Store.list('entries').slice().sort((a, b) => a.createdAt < b.createdAt ? 1 : -1).forEach(e => { const f = e.foodId && foodById(e.foodId); if (f && !seen.has(f.id) && out.length < 12) { seen.add(f.id); out.push(f); } }); list = out; }
  if (q) { const toks = q.split(/\s+/); list = list.filter(f => toks.every(t => f.name.toLowerCase().includes(t))); list.sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1)); }
  if (!list.length) return `<div class="empty small">${q ? `No match for “${esc(q)}”.` : S.addTab === 'fav' ? 'No favorites yet — tap ☆ on any food.' : 'Nothing here yet.'}<br><button style="margin-top:10px" data-act="customFood">＋ Create “${esc(S.foodQuery.trim() || 'custom food')}”</button></div>`;
  return list.slice(0, 40).map(row).join('');
}

function portionSheet(food, existing) {
  const unitsAvail = [['small', 'Small'], ['medium', 'Medium'], ['large', 'Large'], ['g', 'Grams']];
  if (food.cupG) unitsAvail.push(['cup', 'Cup']); if (food.palmG) unitsAvail.push(['palm', 'Palm']);
  let unit = 'medium', qty = 1, acc = settings().lastAcc || 'good', meal = mealNow();
  const gramsOf = () => unit === 'g' ? qty : qty * (unit === 'cup' ? food.cupG : unit === 'palm' ? food.palmG : food.portions[unit]);
  const label = () => unit === 'g' ? `${r0(qty)} g` : `${qty} × ${unit}${unit === 'cup' || unit === 'palm' ? '' : ' portion'} (${r0(gramsOf())} g)`;
  openSheet(food.name, `
    <div class="seg" id="uSeg">${unitsAvail.map(([k, l]) => `<button data-v="${k}" class="${k === unit ? 'on' : ''}">${l}</button>`).join('')}</div>
    <label class="f"><span id="qLab">Quantity</span>${stepper('pQty', 1, 0.5, '')}</label>
    <div class="card" id="pPrev" style="margin:8px 0"></div>
    <label class="f"><span>How accurate is this estimate?</span></label>
    <div class="seg" id="aSeg">${[['exact', 'Exact'], ['good', 'Good guess'], ['rough', 'Rough']].map(([k, l]) => `<button data-v="${k}" class="${k === acc ? 'on' : ''}">${l}</button>`).join('')}</div>
    <label class="f"><span>Meal</span></label>
    <div class="seg" id="mSeg">${MEALS.map(m => `<button data-v="${m}" class="${m === meal ? 'on' : ''}">${cap(m)}</button>`).join('')}</div>
    <button class="primary block" id="pAdd" style="margin-top:14px">Add to ${S.addDate === todayStr() ? 'today' : fmtDate(S.addDate)}</button>`, sh => {
    const draw = () => {
      const g = gramsOf(), n = Calc.scaleFood(food, g);
      $('#pPrev').innerHTML = `<b>${r0(n.kcal)} kcal</b> <span class="muted small">· ${label()}</span><div class="small muted" style="margin-top:4px">P ${r0(n.protein)} g · C ${r0(n.carbs)} g · F ${r0(n.fat)} g · fiber ${r0(n.fiber)} g · sodium ${r0(n.sodium)} mg · added sugar ${r1(n.addedSugar)} g</div>${food.flags.length ? `<div class="small" style="margin-top:4px">${food.flags.map(f => `<span class="pill good">${FLAG_NAMES[f]}</span>`).join(' ')}</div>` : ''}`;
    };
    const seg = (id, fn) => $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); draw(); });
    seg('#uSeg', v => { unit = v; qty = v === 'g' ? r0(gramsOf() || food.portions.medium) : 1; if (v === 'g') qty = food.portions.medium; $('#pQty').value = qty; const st = sh.querySelector('[data-step=pQty]'); sh.querySelectorAll('[data-step=pQty]').forEach((b, i) => b.dataset.d = (i ? 1 : -1) * (v === 'g' ? 10 : 0.5)); });
    seg('#aSeg', v => { acc = v; }); seg('#mSeg', v => { meal = v; });
    $('#pQty').addEventListener('input', () => { const v = num('pQty'); if (v != null && v > 0) { qty = v; draw(); } });
    sh.addEventListener('click', e => { if (e.target.closest('[data-step=pQty]')) setTimeout(() => { const v = num('pQty'); if (v != null && v > 0) { qty = v; draw(); } }, 0); });
    $('#pAdd').addEventListener('click', () => {
      if (!(qty > 0) || qty > 5000) { toast('Enter a quantity greater than 0.'); return; }
      const g = gramsOf(), n = Calc.scaleFood(food, g);
      const rec = stamp(Object.assign({ date: S.addDate, meal, name: food.name, foodId: food.id, qtyLabel: label(), grams: r0(g), accuracy: acc, flags: food.flags }, n));
      persistWarn(Store.put('entries', rec)); Store.save(d => { d.settings.lastAcc = acc; });
      closeSheet(); S.foodDate = S.addDate; rerender(); toast(`Added ${food.name}`, () => { Store.del('entries', rec.id); rerender(); }); buzz(15);
    });
    draw();
  });
}

const NUT_FIELDS = [['kcal', 'Calories (kcal)'], ['protein', 'Protein (g)'], ['carbs', 'Carbs (g)'], ['fat', 'Fat (g)'], ['fiber', 'Fiber (g)'], ['sodium', 'Sodium (mg)'], ['addedSugar', 'Added sugar (g)'], ['naturalSugar', 'Natural sugar (g)']];
function nutrientForm(vals) {
  return `<div class="grid2">${NUT_FIELDS.map(([k, l]) => `<label class="f" style="margin:6px 0"><span>${l}</span><input id="n_${k}" inputmode="decimal" value="${vals && vals[k] != null ? vals[k] : ''}" placeholder="0"></label>`).join('')}</div>
    <label class="f"><span>Nutrient tags (for the gap analysis)</span></label><div class="seg" id="flagSeg">${Object.entries(FLAG_NAMES).map(([k, l]) => `<button type="button" data-v="${k}" class="${vals && vals.flags && vals.flags.includes(k) ? 'on' : ''}" style="flex:0 0 auto;font-size:13px">${l}</button>`).join('')}</div>`;
}
function readNutrients() {
  const o = {}; for (const [k, l] of NUT_FIELDS) { const raw = $('#n_' + k).value.trim(); const v = raw === '' ? 0 : parseFloat(raw.replace(',', '.')); if (!isFinite(v) || v < 0 || v > 20000) return { err: `${l}: enter a number between 0 and 20000.` }; o[k] = v; }
  o.flags = [...document.querySelectorAll('#flagSeg button.on')].map(b => b.dataset.v);
  return o;
}
function bindFlags(sh) { sh.querySelector('#flagSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.classList.toggle('on'); }); }

function manualSheet(entry) {
  const e = entry || { name: '', accuracy: 'good', meal: mealNow() };
  let acc = e.accuracy, meal = e.meal;
  openSheet(entry ? 'Edit entry' : 'Quick entry', `
    <label class="f"><span>Name</span><input id="mName" value="${esc(e.name)}" placeholder="e.g. Lunch at café" autocomplete="off"></label>
    ${nutrientForm(e)}
    <label class="f"><span>Estimate accuracy</span></label><div class="seg" id="aSeg">${[['exact', 'Exact'], ['good', 'Good guess'], ['rough', 'Rough']].map(([k, l]) => `<button data-v="${k}" class="${k === acc ? 'on' : ''}">${l}</button>`).join('')}</div>
    <label class="f"><span>Meal</span></label><div class="seg" id="mSeg">${MEALS.map(m => `<button data-v="${m}" class="${m === meal ? 'on' : ''}">${cap(m)}</button>`).join('')}</div>
    <p class="err" id="mErr"></p><button class="primary block" id="mSave">${entry ? 'Save changes' : 'Add'}</button>${entry ? '<button class="block danger" id="mDel" style="margin-top:8px">Delete entry</button>' : ''}`, sh => {
    bindFlags(sh);
    const seg = (id, fn) => $(id).addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); });
    seg('#aSeg', v => { acc = v; }); seg('#mSeg', v => { meal = v; });
    $('#mSave').addEventListener('click', () => {
      const name = $('#mName').value.trim(); if (!name) { $('#mErr').textContent = 'Give it a name.'; return; }
      const n = readNutrients(); if (n.err) { $('#mErr').textContent = n.err; return; }
      const base = entry ? Object.assign({}, entry, { updatedAt: nowISO() }) : stamp({ date: S.foodDate, foodId: null, qtyLabel: 'manual entry' });
      const rec = Object.assign(base, n, { name, accuracy: acc, meal });
      persistWarn(Store.put('entries', rec)); closeSheet(); rerender(); toast(entry ? 'Entry updated' : 'Added ' + name); buzz(15);
    });
    if (entry) $('#mDel').addEventListener('click', () => { closeSheet(); deleteItem('entry', entry.id); });
  });
}
function customFoodSheet() {
  openSheet('Custom food', `
    <label class="f"><span>Name</span><input id="cName" value="${esc(S.foodQuery.trim())}" autocomplete="off"></label>
    <label class="f"><span>Serving size (g)</span>${stepper('cServ', 100, 10, 'g')}</label>
    <p class="tiny muted">Enter the nutrition for ONE serving of that size (as on a label).</p>${nutrientForm(null)}
    <p class="err" id="cErr"></p><button class="primary block" id="cSave">Save food</button>`, sh => {
    bindFlags(sh);
    $('#cSave').addEventListener('click', () => {
      const name = $('#cName').value.trim(), g = num('cServ'); if (!name) { $('#cErr').textContent = 'Give it a name.'; return; }
      if (g == null || g < 1 || g > 5000) { $('#cErr').textContent = 'Serving size must be 1–5000 g.'; return; }
      const n = readNutrients(); if (n.err) { $('#cErr').textContent = n.err; return; }
      const per100 = {}; NUTS.forEach(k => { per100[k] = r2(n[k] * 100 / g); });
      const rec = stamp({ name, per100, portions: { small: r0(g * 0.5), medium: r0(g), large: r0(g * 1.5) }, flags: n.flags, cupG: 0, palmG: 0, custom: true });
      persistWarn(Store.put('customFoods', rec)); closeSheet(); S.foodQuery = ''; portionSheet(rec);
    });
  });
}
function addEntriesFromMeal(items, date, meal) {
  const recs = items.map(i => stamp(Object.assign({}, i, { id: undefined, date, meal: meal || i.meal })));
  recs.forEach(r => { r.id = uid(); r.createdAt = nowISO(); r.updatedAt = nowISO(); Store.put('entries', r); });
  return recs;
}

function viewWorkout() {
  const sp = D.currentSplit(), tg = D.targetSplit(), act = D.active();

  else h += MUSCLES.map(m => { const v = hs[m], flag = v < 10 ? (v < 6 ? 'low' : '') : v > 20 ? 'high' : ''; return `<div class="row sp small" style="padding:3px 0"><span style="width:90px">${cap(m)}</span><div class="bar" style="flex:1"><i style="width:${Math.min(100, v / 20 * 100)}%;background:${v > 20 ? 'var(--warn)' : v >= 10 ? 'var(--accent)' : '#6aa9ff'}"></i></div><b style="width:44px;text-align:right">${r1(v)}</b></div>`; }).join('') + why(['A hard set = a completed working set (not a warm-up) at RPE ≥ 7, or with no RPE entered.', 'Primary muscle counts 1 set, secondary muscles 0.5 set.', 'A commonly suggested range is about 10–20 hard sets per muscle per week; below ~10 may be a bit low for growth, above ~20 may add fatigue. A starting point, not a rule.']);
  h += `</div>`;
  // exercises with history

  return h;
}

/* ------------------------------ Workout session ------------------------------ */
function lastSets(exId) { const h = Calc.exerciseHistory(D.sessions(), exId); return h.length ? h[h.length - 1].sets : null; }
function newSetFor(exId, idx, repMin, prev) {
  const p = prev && (prev[idx] || prev[prev.length - 1]);
  return stamp({ exId, weight: p ? p.weight : 0, reps: p ? p.reps : repMin, rpe: null, note: '', done: false, warmup: false });
}
function startSession(dow) {
  const sp = D.currentSplit(); if (!sp) return toast('Set up a split first.');
  const d = sp.days[dow]; if (!d || d.rest || !d.exercises.length) return toast('That day has no exercises.');
  if (D.active()) { go('workout', 'session'); return; }
  const sets = []; d.exercises.forEach(x => { const prev = lastSets(x.exId); for (let i = 0; i < x.sets; i++) sets.push(newSetFor(x.exId, i, x.repMin, prev)); });
  const se = stamp({ date: todayStr(), dayName: d.name, splitId: sp.id, status: 'active', startedAt: nowISO(), planned: d.exercises.map(x => ({ exId: x.exId, sets: x.sets, repMin: x.repMin, repMax: x.repMax })), sets });
  persistWarn(Store.put('sessions', se)); S.openEx = d.exercises[0].exId; wakeAcquire(); S.tab = 'workout'; S.sub = 'session'; S.stack = []; try { history.pushState({ s: 1 }, ''); } catch (e) {} render(); $('#main').scrollTop = 0;
}
function planFor(se, exId) { return se.planned.find(p => p.exId === exId) || { exId, sets: 3, repMin: 8, repMax: 12 }; }
function sessionExerciseIds(se) { const ids = []; se.planned.forEach(p => ids.push(p.exId)); se.sets.forEach(s => { if (!ids.includes(s.exId)) ids.push(s.exId); }); return ids; }

function viewSession() {
  const se = D.active(); if (!se) { S.sub = null; return viewWorkout(); }
  const done = se.sets.filter(s => s.done).length, mins = Math.max(0, Math.round((Date.now() - new Date(se.startedAt)) / 60000));
  let h = `<div class="row sp"><div><h1 style="margin:0">${esc(se.dayName)}</h1><span class="small muted">${done}/${se.sets.length} sets · ${mins} min</span></div><button class="primary" data-act="finishSession">Finish</button></div>`;
  // deload suggestion
  const hist = []; [...new Set(D.sessions().flatMap(x => x.sets.map(y => y.exId)))].forEach(id => { const ex = exById(id); if (ex) hist.push({ ex, hist: Calc.exerciseHistory(D.sessions(), id) }); });
  const fat = Calc.fatigue(hist, todayStr());
  if (fat) h += `<div class="card banner"><p><b>Possible fatigue pattern</b></p><p class="small muted">${esc(fat.regressions.map(e => e.name).join(', '))} dipped vs last session (${fat.regressions.length} of ${fat.of} recent lifts). You might consider a lighter deload week (about 60% of your usual sets) and checking sleep and food — your call.</p></div>`;
  h += sessionExerciseIds(se).map(id => exerciseCard(se, id)).join('');
  h += `<button class="block" data-act="sessionAddEx" style="margin-top:12px">＋ Add exercise</button><button class="block danger" data-act="cancelSession" style="margin-top:8px">Discard workout</button>`;
  return h;
}
function exerciseCard(se, id) {
  const ex = exById(id) || { name: 'Exercise', muscle: '' }, sets = se.sets.filter(s => s.exId === id), nd = sets.filter(s => s.done).length, open = S.openEx === id, plan = planFor(se, id);
  let h = `<div class="card exc ${open ? 'open' : ''}"><div class="row sp"><button class="exhead" data-act="toggleEx" data-id="${esc(id)}"><b>${esc(ex.name)}</b><br><span class="small muted">${nd}/${sets.length} sets · ${plan.repMin}–${plan.repMax} reps</span></button>${infoBtn(id)}</div>`;
  if (open) {
    const hist = Calc.exerciseHistory(D.sessions(), id), nt = Calc.nextTime(hist, plan.repMin, plan.repMax, settings().plateInc), step = r2(U.wToDisp(settings().plateInc));
    if (nt) h += `<button class="nextchip" data-act="applyNext" data-id="${esc(id)}">Next time: ${r1(U.wToDisp(nt.weight))} ${U.w()} × ${nt.reps} <span class="small">· ${nt.kind === 'weight' ? 'add weight' : nt.kind === 'reps' ? 'add a rep' : 'hold'} · tap to apply</span></button>${why(nt.why)}`;
    else h += `<div class="nextchip" style="font-size:15px;font-weight:600;min-height:0">First time: start light — pick a weight you can lift ${plan.repMin}–${plan.repMax} times with 2–3 reps in reserve</div>`;
    if (Calc.isStalled(hist)) h += `<div class="card banner" style="margin:8px 0"><p class="small"><b>Progress has stalled</b> (no e1RM gain in 3 sessions). Options:</p><ul class="small" style="padding-left:18px;margin:4px 0">${Calc.stallOptions(hist, settings().plateInc, ex.easier && ex.harder ? ex.harder : '').map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>`;
    h += sets.map((s, i) => setRow(s, i, step)).join('');
    h += `<div class="grid2"><button data-act="addSet" data-id="${esc(id)}">＋ Add set</button><button data-act="exHistory" data-id="${esc(id)}">History</button></div>`;
  }
  return h + `</div>`;
}
function setRow(s, i, step) {
  const wv = r1(U.wToDisp(s.weight));
  return `<div class="setrow ${s.done ? 'done' : ''}" data-setid="${s.id}"><div class="row sp"><b>Set ${i + 1}</b><select class="rpe" data-set="${s.id}" data-f="rpe" aria-label="RPE (optional)"><option value="">RPE (optional)</option>${[6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10].map(v => `<option ${s.rpe === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="tiny muted" style="margin:6px 0 2px 4px">Weight (${U.w()})</div>
    <div class="stepper"><button type="button" data-step="w_${s.id}" data-d="-${step}" aria-label="Less weight">−</button><input id="w_${s.id}" data-set="${s.id}" data-f="weight" inputmode="decimal" value="${wv}" aria-label="Weight ${U.w()}"><button type="button" data-step="w_${s.id}" data-d="${step}" aria-label="More weight">+</button></div>
    <div class="tiny muted" style="margin:6px 0 2px 4px">Reps</div>
    <div class="row"><div class="stepper" style="flex:1;min-width:0"><button type="button" data-step="r_${s.id}" data-d="-1" aria-label="Fewer reps">−</button><input id="r_${s.id}" data-set="${s.id}" data-f="reps" inputmode="numeric" value="${s.reps}" aria-label="Reps"><button type="button" data-step="r_${s.id}" data-d="1" aria-label="More reps">+</button></div>
    <button class="chk ${s.done ? 'on' : ''}" data-act="toggleSet" data-id="${s.id}" aria-label="Complete set" style="min-height:48px">✓</button></div>
    <details><summary style="min-height:44px;display:flex;align-items:center">Note${s.note ? ' ✎' : ''}</summary><input data-set="${s.id}" data-f="note" value="${esc(s.note || '')}" placeholder="Note (optional)" style="margin-bottom:6px"></details></div>`;
}
function updateSet(id, f, raw) {
  const se = D.active(); if (!se) return;
  const s = se.sets.find(x => x.id === id); if (!s) return;
  if (f === 'weight') { const v = parseFloat(String(raw).replace(',', '.')); if (isFinite(v) && v >= 0 && v < 2000) s.weight = Math.round(U.wFromDisp(v) * 1000) / 1000; }
  else if (f === 'reps') { const v = parseInt(raw, 10); if (isFinite(v) && v >= 0 && v <= 200) s.reps = v; }
  else if (f === 'rpe') s.rpe = raw === '' ? null : parseFloat(raw);
  else if (f === 'note') s.note = String(raw).slice(0, 200);
  s.updatedAt = nowISO(); Store.put('sessions', se);
}
function toggleSet(id) {
  const se = D.active(); const s = se && se.sets.find(x => x.id === id); if (!s) return;
  if (!s.done) {
    // commit any open inputs first
    const w = $('#w_' + id), r = $('#r_' + id); if (w) updateSet(id, 'weight', w.value); if (r) updateSet(id, 'reps', r.value);
    if (!(s.reps > 0)) { toast('Enter at least 1 rep.'); buzz(30); return; }
    s.done = true; s.updatedAt = nowISO(); Store.put('sessions', se);
    const prior = Calc.exerciseHistory(D.sessions(), s.exId);
    if (Calc.isPR(s, prior)) { toast(`🏆 New PR! ${(exById(s.exId) || {}).name}: ${r1(U.wToDisp(s.weight))} ${U.w()} × ${s.reps} (e1RM ${r1(U.wToDisp(Calc.e1rm(s.weight, s.reps)))})`); buzz([60, 40, 60]); } else buzz(20);
    restStart(settings().restSeconds);
    // advance to next exercise when all sets of this one are done
    const ids = sessionExerciseIds(se), sets = se.sets.filter(x => x.exId === s.exId);
    if (sets.every(x => x.done)) { const nxt = ids.find(i => se.sets.some(x => x.exId === i && !x.done)); if (nxt) S.openEx = nxt; }
  } else { s.done = false; s.updatedAt = nowISO(); Store.put('sessions', se); }
  rerender();
}

/* ---- rest timer (timestamps, survives sleep) ---- */
let restTimer = null;
function restStart(sec) { S.rest = { end: Date.now() + sec * 1000, total: sec, finished: false }; try { sessionStorage.setItem('fitness.rest', JSON.stringify(S.rest)); } catch (e) {} restTick(); }
function restClear() { S.rest = null; try { sessionStorage.removeItem('fitness.rest'); } catch (e) {} restTick(); }
function restTick() {
  clearTimeout(restTimer);
  const el = $('#restBar'); if (!el) return;
  document.body.classList.toggle('resting', !!(S.rest && D.active()));
  if (!S.rest || !D.active()) { el.classList.remove('on'); return; }
  const left = Math.ceil((S.rest.end - Date.now()) / 1000);
  el.classList.add('on');
  if (left > 0) {
    el.innerHTML = `<span>⏱ Rest <b>${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</b></span><span class="row" style="gap:6px"><button data-act="restAdd" data-s="-15" aria-label="15 seconds less">−15</button><button data-act="restAdd" data-s="15" aria-label="15 seconds more">+15</button><button data-act="restSkip">Skip</button></span><i style="width:${Math.max(0, left / S.rest.total * 100)}%"></i>`;
    restTimer = setTimeout(restTick, 250);
  } else {
    if (!S.rest.finished) { S.rest.finished = true; S.rest.doneAt = Date.now(); buzz([250, 120, 250]); }
    el.innerHTML = `<span>✅ Rest done — go!</span><button data-act="restSkip">OK</button>`;
    if (Date.now() - S.rest.doneAt > 6000) { restClear(); return; }
    restTimer = setTimeout(restTick, 1000);
  }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { restTick(); if (D.active()) wakeAcquire(); } });

/* ---- wake lock ---- */
async function wakeAcquire() {
  if (!settings().wakeLock || !('wakeLock' in navigator)) return;
  try { if (S.wake && !S.wake.released) return; S.wake = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function wakeRelease() { try { if (S.wake) S.wake.release(); } catch (e) {} S.wake = null; }

function finishSession() {
  const se = D.active(); if (!se) return;
  const dn = se.sets.filter(s => s.done), left = se.sets.length - dn.length;
  if (!dn.length) { openSheet('No sets completed', `<p>Nothing was checked off. Discard this workout?</p><button class="block danger" data-act="cancelSessionYes">Discard</button><button class="block" data-act="closeSheet" style="margin-top:8px">Keep going</button>`); return; }
  openSheet('Finish workout?', `<p>${dn.length} sets done${left ? `, ${left} not completed (they won't be saved)` : ''}.</p><button class="primary block" id="finOk">Finish & save</button><button class="block" data-act="closeSheet" style="margin-top:8px">Keep going</button>`, () => {
    $('#finOk').addEventListener('click', () => {
      se.sets = dn; se.status = 'done'; se.finishedAt = nowISO(); se.updatedAt = nowISO(); Store.put('sessions', se);
      const vol = dn.reduce((a, s) => a + s.weight * s.reps, 0);
      wakeRelease(); restClear(); closeSheet(); go('workout'); toast(`Saved: ${dn.length} sets · ${r0(U.wToDisp(vol)).toLocaleString()} ${U.w()} total volume`); buzz(30);
    });
  });
}

/* ---- exercise history ---- */
function viewExerciseHistory(id) {
  const ex = exById(id); if (!ex) return `<div class="card empty">Exercise not found.</div>`;
  const sess = D.sessions(), hist = Calc.exerciseHistory(sess, id), pr = Calc.prs(hist);
  const sp = D.currentSplit(); let range = { repMin: 8, repMax: 12 };
  if (sp) sp.days.forEach(d => d.exercises.forEach(x => { if (x.exId === id) range = x; }));
  let h = `<div class="row"><button data-act="back" aria-label="Back">←</button><h1 style="margin:0;flex:1;min-width:0">${esc(ex.name)}</h1>${infoBtn(id)}</div>`;
  if (!hist.length) return h + `<div class="card empty"><p><b>No sessions yet</b></p><p class="small">Log this exercise in a workout and your history, PRs and progress chart appear here.</p></div>`;
  h += `<div class="grid2"><div class="stat"><b>${U.fw(pr.e1rm.v)}</b><span>best estimated 1RM</span></div><div class="stat"><b>${U.fw(pr.weight.w)} × ${pr.weight.reps}</b><span>heaviest set</span></div></div>
    ${why([`Epley: e1RM = weight × (1 + reps ÷ 30). Best set: ${U.fw(pr.e1rm.w)} × ${pr.e1rm.reps} → ${r1(pr.e1rm.w)} × (1 + ${pr.e1rm.reps}/30) = <code>${r1(pr.e1rm.v)} kg</code> (${pr.e1rm.date}).`, `Estimates get less accurate above ~10 reps.`])}
    <div class="card"><h3>Progress <span class="muted small">(e1RM per session, ${U.w()})</span></h3>${lineChart('ex_' + id, hist.map(x => ({ date: x.date, value: x.best, ma: x.best })), v => U.wToDisp(v))}</div>`;
  const nt = Calc.nextTime(hist, range.repMin, range.repMax, settings().plateInc);
  if (nt) h += `<div class="nextchip">Next time: ${r1(U.wToDisp(nt.weight))} ${U.w()} × ${nt.reps}</div>${why(nt.why)}`;
  if (Calc.isStalled(hist)) h += `<div class="card banner"><p><b>Stalled</b> — no progress in 3 sessions.</p><ul class="small" style="padding-left:18px">${Calc.stallOptions(hist, settings().plateInc, ex.harder).map(o => `<li>${esc(o)}</li>`).join('')}</ul></div>`;
  const hs = Calc.weeklyHardSets(sess, exById, todayStr());
  h += `<p class="small muted">Weekly hard sets for ${ex.muscle} (all exercises, last 7 days): <b>${r1(hs[ex.muscle] || 0)}</b></p><h2>Sessions</h2>`;
  h += hist.slice().reverse().map((x, i, arr) => { const prior = hist.slice(0, hist.length - 1 - i); const isPR = prior.length && x.best > Math.max(...prior.map(p => p.best)); return `<div class="card"><div class="row sp"><b>${fmtDate(x.date)}</b>${isPR ? '<span class="pill good">🏆 PR</span>' : ''}</div><p class="small muted">${x.sets.map(s => `${r1(U.wToDisp(s.weight))}×${s.reps}${s.rpe ? ' @' + s.rpe : ''}`).join(' · ')} ${U.w()}</p>${x.sets.some(s => s.note) ? `<p class="tiny muted">${esc(x.sets.filter(s => s.note).map(s => s.note).join(' / '))}</p>` : ''}</div>`; }).join('');
  return h;
}

  h += `<p class="small muted">All numbers are suggestions based on formulas — tap “Why this number?” under any of them. Recalculated automatically when your weight or body fat changes.</p>
  <div class="card"><h3>Energy</h3><div class="grid2" style="margin-top:8px">
    <div class="stat"><b>${r0(t.bmr.kcal)}</b><span>BMR · ${t.bmr.method}</span></div>

    ${s.useStepsInTdee ? (stepKcalAdj() ? `<p class="tiny muted">Step adjustment is on (7-day average steps × weight × ${s.stepKcalPerKgStep} kcal). If you also chose a high activity level, this may double-count — consider “Sedentary” or “Lightly active”.</p>` : `<p class="tiny muted">Step adjustment is on but no steps are logged in the last 7 days.</p>`) : ''}</div>

    <label class="f"><span>Adjustment % (typical for ${GOALS[i.p.goal].label.toLowerCase()}: ${GOALS[i.p.goal].range})</span>${stepper('adjPct', t.cal.pct, 1, '%')}</label>

    ${['protein', 'fat', 'carbs', 'fiber'].map(k => why(g[k].why, k)).join('')}
    <label class="f"><span>Protein (g per kg bodyweight; common range 1.6–2.2)</span>${stepper('protKg', i.p.proteinPerKg || 2.0, 0.1, 'g/kg')}</label></div>`;

}

/* ------------------------------ Trends ------------------------------ */

  const ws = weightSeries(), bs = bfSeries(), t = getTargets(), s = settings(), today = todayStr();

      <div class="card"><h3>Protein <span class="muted small">g/day</span></h3>${barChart('pr', d14.map(d => ({ label: lbl(d), value: Math.round(Calc.dayTotals(D.entries(d)).protein.v) })), t && t.macros.protein.g, v => r0(v), '#6aa9ff')}</div>`;

  } else h += `<p class="small muted">No steps logged. Tap “Log steps”, or use the +1000 chip on Today.</p>`;
  h += `</div>`;
  if (sess.length) {
    const hs = Calc.weeklyHardSets(sess, exById, today);
    h += `<div class="card"><h3>Weekly hard sets <span class="muted small">by muscle · last 7 days</span></h3>${barChart('vol', MUSCLES.map(m => ({ label: m.slice(0, 4), value: r1(hs[m]) })), 10, v => r0(v), 'var(--accent)')}<p class="tiny muted">Dashed line = ~10 sets/week.</p></div>`;
    const wk = Array.from({ length: 8 }, (_, k) => { const end = shiftDate(today, -7 * (7 - k)), from = shiftDate(end, -6); const vol = sess.filter(x => x.date >= from && x.date <= end).reduce((a, x) => a + x.sets.reduce((b, y) => b + y.weight * y.reps, 0), 0); return { label: fmtDate(end).replace(/\s/g, ''), value: Math.round(U.wToDisp(vol)) }; });

    const ids = [...new Set(sess.flatMap(x => x.sets.map(y => y.exId)))].filter(id => exById(id));

function doImport(file) {

    const err = validateImport(data); if (err) return toast(err);

}

    if (k % 3 === 0) d.metrics.push(stamp({ type: 'bodyfat', date: dt, value: r1(19.4 - k * 0.03 + (rnd() - .5) * 1.2) }));
    if (k >= 14) d.metrics.push(stamp({ type: 'steps', date: dt, value: Math.round(5000 + rnd() * 6500) }));
    if (k >= 18) { [300, 500, 400, 350].forEach(ml => d.metrics.push(stamp({ type: 'water', date: dt, value: ml }))); }
  });
  const F = n => FOOD_RAW.find(f => f.name === n);

  const alt = [['Egg, whole', 'large'], ['Whole-wheat bread', 'large'], ['Cheese pizza slice', 'medium']];
  days.slice(-14).forEach((dt, k) => menu.forEach(([meal, items]) => items.forEach(([n, p], j) => {
    let f = F(n), por = p; if (meal === 'breakfast' && j === 2 && k % 4 === 0) { f = F(alt[0][0]); por = alt[0][1]; } if (meal === 'dinner' && j === 0 && k % 5 === 0) { f = F(alt[2][0]); por = alt[2][1]; }
    const g = f.portions[por], n2 = Calc.scaleFood(f, g);
    d.entries.push(stamp(Object.assign({ date: dt, meal, name: f.name, foodId: f.id, qtyLabel: `1 × ${por} portion (${g} g)`, grams: g, accuracy: ['exact', 'good', 'good', 'rough'][(k + j) % 4], flags: f.flags }, n2)));
  })));
  const g4 = Calc.generateSplit({ days: 4, minutes: 60, equipment: 'full', experience: 'intermediate', avoid: '' }, EX_RAW), g6 = Calc.generateSplit({ days: 6, minutes: 60, equipment: 'full', experience: 'advanced', avoid: '' }, EX_RAW);
  const mk = (g, name) => stamp({ name, days: g.days.map(x => ({ dow: x.dow, name: x.name, rest: x.rest, exercises: x.exercises.map(e => ({ exId: e.exId, sets: e.sets, repMin: e.repMin, repMax: e.repMax })) })) });
  const sp = mk(g4, 'Upper / Lower (sample)'), tg = mk(g6, 'PPL ×2 (sample target)'); d.splits.push(sp, tg); d.settings.currentSplitId = sp.id; d.settings.targetSplitId = tg.id;
  const base = { squat: 70, bench: 60, bbrow: 55, ohp: 35, rdl: 80, deadlift: 100, legpress: 120, pullup: 0, latpull: 50, incdb: 22, dbpress: 20, lateral: 8, dbcurl: 12, bbcurl: 25, pushdown: 25, skull: 25, legcurl: 35, legext: 40, calfraise: 60, lunge: 16, bulgarian: 16, hangraise: 0, plank: 0, cablerow: 45, facepull: 20, chinup: 0, goblet: 24, cablecrunch: 30 };
  for (let k = 20; k >= 0; k--) {

    if (day.rest || !day.exercises.length || k === 0) continue;
    const wk = Math.floor((20 - k) / 7), sets = [];
    day.exercises.forEach((x, xi) => { const b = (base[x.exId] != null ? base[x.exId] : 20) + wk * (x.exId in base && base[x.exId] >= 30 ? 2.5 : 0); for (let s = 0; s < x.sets; s++) sets.push(stamp({ exId: x.exId, weight: Math.round(b / 2.5) * 2.5, reps: Math.min(x.repMax, x.repMin + Math.floor(rnd() * 3) + (s === 0 ? 1 : 0)), rpe: s === x.sets - 1 ? 8.5 : 7.5, note: '', done: true, warmup: false, createdAt: dt + 'T10:00:00.000Z' })); });
    d.sessions.push(stamp({ date: dt, dayName: day.name, splitId: sp.id, status: 'done', startedAt: dt + 'T10:00:00.000Z', finishedAt: dt + 'T11:00:00.000Z', planned: day.exercises.map(x => ({ exId: x.exId, sets: x.sets, repMin: x.repMin, repMax: x.repMax })), sets }));
  }

}
function loadSeed() {
  openSheet('Load sample data?', `<p>This <b>replaces everything</b> on this device with a small sample: a profile, 4 weeks of weight, 2 weeks of food, steps, water, an Upper/Lower split and 3 weeks of workouts.</p><p class="small muted">Export a backup first if you have real data.</p>
    <button class="primary block" id="seedOk">Load sample data</button><button class="block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`, () => {
    $('#seedOk').addEventListener('click', () => { persistWarn(Store.replaceAll(seedData())); closeSheet(); go('today'); toast('Sample data loaded'); });
  });
}

/* ------------------------------ Actions ------------------------------ */
function saveProfileField(k, v) { persistWarn(Store.save(d => { if (d.profile) d.profile[k] = v; })); rerender(); }
function setRole(id, role) {
  Store.save(d => { if (role === 'current') { d.settings.currentSplitId = id; if (d.settings.targetSplitId === id) d.settings.targetSplitId = null; } else { d.settings.targetSplitId = id; if (d.settings.currentSplitId === id) d.settings.currentSplitId = null; } });
  rerender(); toast(role === 'current' ? 'Set as current split' : 'Set as target split');
}
function logFoodQuick(food, date) {
  const g = food.portions.medium, n = Calc.scaleFood(food, g);
  const rec = stamp(Object.assign({ date, meal: mealNow(), name: food.name, foodId: food.id, qtyLabel: `1 × medium portion (${g} g)`, grams: g, accuracy: 'good', flags: food.flags }, n));
  Store.put('entries', rec); rerender(); toast('Added ' + food.name, () => { Store.del('entries', rec.id); rerender(); }); buzz(12);
}
const A = {
  noop() {}, closeSheet() { closeSheet(); }, back() { back(); },

  tabFood() { go('food'); }, tabWorkout() { go('workout'); },

  quickFav(el) { const f = foodById(el.dataset.id); if (f) logFoodQuick(f, todayStr()); },
  quickRecent(el) { const e = Store.byId('entries', el.dataset.id); if (!e) return; const rec = stamp(Object.assign({}, e, { id: undefined, date: todayStr(), meal: mealNow(), createdAt: undefined, updatedAt: undefined })); rec.id = uid(); rec.createdAt = nowISO(); rec.updatedAt = nowISO(); Store.put('entries', rec); rerender(); toast('Added ' + e.name, () => { Store.del('entries', rec.id); rerender(); }); buzz(12); },
  addFood() { S.foodQuery = ''; foodSearchSheet(S.tab === 'food' ? S.foodDate : todayStr()); },
  addFoodId(el) { S.addDate = todayStr(); const f = foodById(el.dataset.id); if (f) portionSheet(f); },

  favFood(el) { const id = el.dataset.id; Store.save(d => { const a = d.settings.favFoods, i = a.indexOf(id); if (i >= 0) a.splice(i, 1); else a.push(id); }); $('#fres').innerHTML = foodResults(); buzz(8); },
  customFood() { customFoodSheet(); }, manualEntry() { manualSheet(); },
  editEntry(el) { const e = Store.byId('entries', el.dataset.id); if (e) manualSheet(e); },
  saveMeal(el) {
    const list = D.entries(S.foodDate).filter(e => e.meal === el.dataset.meal);
    openSheet('Save meal', `<label class="f"><span>Name</span><input id="smName" value="${cap(el.dataset.meal)} ${new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}" autocomplete="off"></label><p class="small muted">${list.length} items · ${r0(list.reduce((a, e) => a + e.kcal, 0))} kcal</p><button class="primary block" id="smOk">Save</button>`, () => {
      $('#smOk').addEventListener('click', () => { const name = $('#smName').value.trim(); if (!name) return; Store.put('savedMeals', stamp({ name, items: list.map(e => { const c = Object.assign({}, e); ['id', 'createdAt', 'updatedAt', 'date', 'source'].forEach(k => delete c[k]); return c; }) })); closeSheet(); toast('Meal saved — find it under Add food → Meals'); });
    });
  },
  logMeal(el) { const m = Store.byId('savedMeals', el.dataset.id); if (!m) return; const recs = addEntriesFromMeal(m.items, S.addDate || S.foodDate, mealNow()); closeSheet(); rerender(); toast(`Added ${m.name}`, () => { recs.forEach(r => Store.del('entries', r.id)); rerender(); }); },
  copyYesterday() {
    const y = shiftDate(S.foodDate, -1), src = D.entries(y);
    if (!src.length) return toast('Nothing logged on the previous day.');
    const recs = addEntriesFromMeal(src, S.foodDate); rerender(); toast(`Copied ${recs.length} entries`, () => { recs.forEach(r => Store.del('entries', r.id)); rerender(); });
  },
  foodPrev() { S.foodDate = shiftDate(S.foodDate, -1); rerender(); },
  foodNext() { if (S.foodDate < todayStr()) { S.foodDate = shiftDate(S.foodDate, 1); rerender(); } },
  gapView(el) { S.gapView = el.dataset.v; rerender(); },
  dismissInsight(el) { Store.save(d => { d.settings.dismissed[el.dataset.key] = todayStr(); }); rerender(); },
  profile() { closeSheet(); profileSheet(); }, logWeight() { weightSheet(); }, editWeightDay(el) { weightSheet(el.dataset.date); },
  targets() { nav('targets'); },
  export() { doExport(); }, import() { $('#importFile').value = ''; $('#importFile').click(); },
  resetAdj() { saveProfileField('calAdjPct', null); },
  loadSeed() { loadSeed(); },
  toggleSetting(el) { const k = el.dataset.key; Store.save(d => { d.settings[k] = !d.settings[k]; }); if (k === 'wakeLock' && !settings().wakeLock) wakeRelease(); rerender(); },
  reset() { openSheet('Erase all data?', `<p>This deletes your profile and every logged entry on this device. It can't be undone — consider exporting a backup first.</p><button class="block danger" id="rstOk">Yes, erase everything</button><button class="block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`, () => $('#rstOk').addEventListener('click', () => { Store.reset(); applyTheme(); closeSheet(); go('today'); toast('All data erased'); })); },
  /* workout */
  workoutIntro() { workoutIntroSheet(); }, pathA() { pathASheet(); }, pathB() { pathBSheet(); },
  manualSplit() { const sp = newSplit('My workout'); Store.put('splits', sp); if (!settings().currentSplitId) Store.save(d => { d.settings.currentSplitId = sp.id; }); closeSheet(); go('workout'); nav('split', sp.id); },
  pasteSheet(el) { pasteSheet(el.dataset.id || null); },
  genSave(el) {
    const g = S.genResult; if (!g) return;
    const sp = newSplit(g.name, g.days.map(x => ({ dow: x.dow, name: x.name, rest: x.rest, exercises: x.exercises.map(e => ({ exId: e.exId, sets: e.sets, repMin: e.repMin, repMax: e.repMax })) })));
    Store.put('splits', sp); let role = el.dataset.role; if (!settings().currentSplitId) role = 'current';
    Store.save(d => { if (role === 'current') d.settings.currentSplitId = sp.id; else d.settings.targetSplitId = sp.id; });
    closeSheet(); go('workout'); toast(role === 'current' ? 'Split saved — edit anything you like' : 'Saved as target split');
  },
  exLibrary() { exercisePicker(id => exInfoSheet(id), 'Exercise guides'); },
  exInfo(el) { exInfoSheet(el.dataset.id); },
  pickEx(el) { const id = el.dataset.id; closeSheet(); if (S.pickCb) S.pickCb(id); },
  customEx() { customExSheet(ex => { closeSheet(); if (S.pickCb) S.pickCb(ex.id); }); },
  editSplit(el) { closeSheet(); go('workout'); nav('split', el.dataset.id); },
  splitsSheet() { splitsSheet(); },
  makeRole(el) { setRole(el.dataset.id, el.dataset.role); if ($('#sheet').classList.contains('on')) splitsSheet(); },
  swapRoles() { const s = settings(); Store.save(d => { const c = d.settings.currentSplitId; d.settings.currentSplitId = d.settings.targetSplitId; d.settings.targetSplitId = c; }); closeSheet(); rerender(); toast('Swapped current and target'); },
  compareSplits() { compareSheet(); },
  delSplit(el) { const id = el.dataset.id, sp = Store.byId('splits', id); openSheet('Delete split?', `<p>Delete “${esc(sp.name)}”? Logged workouts stay in your history.</p><button class="block danger" id="dsOk">Delete</button><button class="block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`, () => $('#dsOk').addEventListener('click', () => { Store.del('splits', id); Store.save(d => { if (d.settings.currentSplitId === id) d.settings.currentSplitId = null; if (d.settings.targetSplitId === id) d.settings.targetSplitId = null; }); closeSheet(); S.sub = null; S.stack = []; rerender(); toast('Split deleted'); })); },
  renameSplit(el) { const sp = Store.byId('splits', el.dataset.id); openSheet('Rename split', `<label class="f"><span>Name</span><input id="rnName" value="${esc(sp.name)}"></label><button class="primary block" id="rnOk">Save</button>`, () => $('#rnOk').addEventListener('click', () => { const v = $('#rnName').value.trim(); if (!v) return; Store.put('splits', Object.assign({}, sp, { name: v, updatedAt: nowISO() })); closeSheet(); rerender(); })); },
  editDay(el) { S.dayDraft = null; dayEditSheet(el.dataset.id, +el.dataset.dow); },
  dayUp(el) { syncDraft(); const e = S.dayDraft.day.exercises, k = +el.dataset.k; [e[k - 1], e[k]] = [e[k], e[k - 1]]; dayEditSheet(S.dayDraft.splitId, S.dayDraft.dow, S.dayDraft.day); },
  dayDown(el) { syncDraft(); const e = S.dayDraft.day.exercises, k = +el.dataset.k; [e[k + 1], e[k]] = [e[k], e[k + 1]]; dayEditSheet(S.dayDraft.splitId, S.dayDraft.dow, S.dayDraft.day); },
  dayRemove(el) { syncDraft(); S.dayDraft.day.exercises.splice(+el.dataset.k, 1); dayEditSheet(S.dayDraft.splitId, S.dayDraft.dow, S.dayDraft.day); },
  dayAddEx() { syncDraft(); const dr = S.dayDraft; exercisePicker(id => { dr.day.exercises.push({ exId: id, sets: 3, repMin: 8, repMax: 12 }); dr.day.rest = false; if (!dr.day.name || dr.day.name === 'Rest') dr.day.name = 'Workout'; dayEditSheet(dr.splitId, dr.dow, dr.day); }); },
  startSession(el) { startSession(+el.dataset.dow); }, openSession() { go('workout', 'session'); wakeAcquire(); },
  finishSession() { finishSession(); },
  cancelSession() { openSheet('Discard workout?', `<p>All sets from this session will be deleted.</p><button class="block danger" data-act="cancelSessionYes">Discard</button><button class="block" data-act="closeSheet" style="margin-top:8px">Keep going</button>`); },
  cancelSessionYes() { const se = D.active(); if (se) Store.del('sessions', se.id); wakeRelease(); restClear(); closeSheet(); go('workout'); toast('Workout discarded'); },
  sessionAddEx() { exercisePicker(id => { const se = D.active(); if (!se) return; const prev = lastSets(id); se.planned.push({ exId: id, sets: 3, repMin: 8, repMax: 12 }); for (let i = 0; i < 3; i++) se.sets.push(newSetFor(id, i, 8, prev)); Store.put('sessions', se); S.openEx = id; rerender(); }); },
  toggleEx(el) { S.openEx = S.openEx === el.dataset.id ? null : el.dataset.id; rerender(); },
  applyNext(el) { const se = D.active(), id = el.dataset.id, plan = planFor(se, id), nt = Calc.nextTime(Calc.exerciseHistory(D.sessions(), id), plan.repMin, plan.repMax, settings().plateInc); if (!nt) return; se.sets.filter(s => s.exId === id && !s.done).forEach(s => { s.weight = nt.weight; s.reps = nt.reps; s.updatedAt = nowISO(); }); Store.put('sessions', se); rerender(); toast('Applied to remaining sets'); },
  addSet(el) { const se = D.active(), id = el.dataset.id, sets = se.sets.filter(s => s.exId === id), last = sets[sets.length - 1]; const ns = stamp({ exId: id, weight: last ? last.weight : 0, reps: last ? last.reps : 8, rpe: null, note: '', done: false, warmup: false }); const idx = se.sets.lastIndexOf(last); se.sets.splice(idx + 1, 0, ns); Store.put('sessions', se); rerender(); },
  toggleSet(el) { toggleSet(el.dataset.id); },
  exHistory(el) { closeSheet(); nav('exercise', el.dataset.id); },
  restAdd(el) { if (S.rest) { S.rest.end += +el.dataset.s * 1000; S.rest.total = Math.max(S.rest.total, Math.ceil((S.rest.end - Date.now()) / 1000)); S.rest.finished = false; restTick(); } },
  restSkip() { restClear(); },
  reviewSplit() { closeSheet(); if (S.sub !== 'review') nav('review'); },
  revMin(el) { Store.save(d => { d.settings.sessionMinutes = +el.dataset.v; }); rerender(); },
  revJoint(el) { Store.save(d => { const a = d.settings.flaggedJoints, i = a.indexOf(el.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(el.dataset.v); }); rerender(); },
  applySwap(el) {
    const r = S.revRes[+el.dataset.r], w = r.swaps[+el.dataset.w], sp = D.currentSplit();
    openSheet('Apply this change?', `<p><b>${esc(w.label)}</b></p><p class="small muted">${esc(w.reason)}</p><p class="small">This edits your current split “${esc(sp.name)}”. You can undo it by editing the day again.</p><button class="primary block" id="apOk">Apply</button><button class="block" data-act="closeSheet" style="margin-top:8px">Cancel</button>`, () => $('#apOk').addEventListener('click', () => { Store.put('splits', Object.assign(Calc.applyAction(sp, w.action, exById), { updatedAt: nowISO() })); closeSheet(); rerender(); toast('Change applied'); }));
  }
};

/* ------------------------------ Events ------------------------------ */
let swiped = false;
document.addEventListener('click', e => {
  const t = e.target;
  const tabBtn = t.closest('[data-tab]'); if (tabBtn) return go(tabBtn.dataset.tab);
  const st = t.closest('[data-step]');
  if (st) {
    const inp = $('#' + st.dataset.step), d = parseFloat(st.dataset.d), cur = parseFloat(String(inp.value).replace(',', '.'));
    const nv = Math.round(((isFinite(cur) ? cur : 0) + d) * 10000) / 10000; inp.value = nv < 0 && !/^(adjPct|st_)/.test(st.dataset.step) ? 0 : nv; buzz(8);
    inp.dispatchEvent(new Event('change', { bubbles: true })); return;
  }
  const u = t.closest('[data-unit]'); if (u) { Store.save(d => { d.settings.units[u.dataset.unit] = u.dataset.v; }); return rerender(); }
  const th = t.closest('[data-themeval]'); if (th) { Store.save(d => { d.settings.theme = th.dataset.themeval; }); applyTheme(); return rerender(); }
  if (t.closest('#backdrop')) return closeSheet();
  const hit = t.closest('.hit');
  if (hit) {
    const c = chartData[hit.dataset.chart], r = c.rows[+hit.dataset.i], ro = $('#ro-' + hit.dataset.chart); buzz(8);
    ro.innerHTML = c.kind === 'line' ? `<b>${fmtDate(r.date)}</b> · daily ${r1(c.unitFn(r.value))} · 7-day avg ${r1(c.unitFn(r.ma))}` : `<b>${esc(r.label)}</b> · ${c.fmt(r.value)}${c.target ? ` (target ${c.fmt(c.target)})` : ''}`;
    return;
  }
  const a = t.closest('[data-act]'); if (!a) return;
  if (a.closest('.item') && swiped) return;
  if (a.matches('a')) e.preventDefault();
  const fn = A[a.dataset.act]; if (fn) fn(a);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.set) { updateSet(t.dataset.set, t.dataset.f, t.value); return; }
  if (t.id === 'adjPct') { const v = num('adjPct'); if (v == null || v < -40 || v > 30) { toast('Adjustment should be between −40% and +30%.'); return rerender(); } saveProfileField('calAdjPct', v); return; }
  if (t.id === 'protKg') { const v = num('protKg'); if (v == null || v < 0.8 || v > 3.5) { toast('Protein should be between 0.8 and 3.5 g/kg.'); return rerender(); } saveProfileField('proteinPerKg', r1(v)); return; }
  if (t.id && t.id.startsWith('st_')) {
    const key = t.id.slice(3), m = SMETA[key]; let v = num(t.id);
    if (v == null) { if (m.nullable && t.value.trim() === '') { Store.save(d => { d.settings[key] = null; }); return rerender(); } toast('Enter a number.'); return rerender(); }
    if (m.kg) v = U.wFromDisp(v);
    if (v < m.min - 1e-9 || v > m.max + 1e-9) { toast(`Value should be between ${m.kg ? r2(U.wToDisp(m.min)) : m.min} and ${m.kg ? r2(U.wToDisp(m.max)) : m.max}.`); return rerender(); }
    Store.save(d => { d.settings[key] = m.kg ? Math.round(v * 1000) / 1000 : v; }); return rerender();
  }
  if (t.id === 'importFile' && t.files[0]) doImport(t.files[0]);
});
// Swipe left to delete (with undo toast).
(() => {
  let row = null, x0 = 0, dx = 0, y0 = 0, lock = null;
  document.addEventListener('touchstart', e => { const r = e.target.closest('.item[data-del]'); if (!r || e.target.closest('input,select,textarea')) return; row = r.querySelector('.in'); x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; lock = null; swiped = false; row.style.transition = 'none'; }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!row) return; dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (lock == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    if (lock === 'x') { row.style.transform = `translateX(${Math.min(0, dx)}px)`; swiped = true; }
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!row) return; const r = row; row = null; r.style.transition = '';
    if (lock === 'x' && dx < -90) { r.style.transform = 'translateX(-110%)'; const [k, id] = r.parentElement.dataset.del.split(':'); setTimeout(() => deleteItem(k, id), 150); }
    else r.style.transform = '';
    setTimeout(() => { swiped = false; }, 60);
  });
})();

/* ------------------------------ Boot ------------------------------ */
applyTheme();
try { const r = JSON.parse(sessionStorage.getItem('fitness.rest') || 'null'); if (r && r.end > Date.now() - 6000) S.rest = r; } catch (e) {}
try { history.pushState({ s: 0 }, ''); } catch (e) {}
render();
if (D.active()) { S.tab = 'workout'; S.sub = 'session'; render(); wakeAcquire(); }
else if (!Store.get().profile) profileSheet();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

</script>
