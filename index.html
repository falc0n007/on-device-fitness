<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>On-Device Fitness</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--text:#e8eaf0;--muted:#9aa3b2;--accent:#3ddc97;--accent-ink:#05281a;--danger:#ff6b6b;--warn:#f5c04a;--line:#2a2f3a;--shadow:0 6px 24px rgba(0,0,0,.45)}
:root[data-theme=light]{--bg:#f4f6fa;--card:#fff;--card2:#eef1f6;--text:#161a22;--muted:#5b6575;--accent:#0e9f6e;--accent-ink:#fff;--danger:#d93a3a;--warn:#b7791f;--line:#dde2ea;--shadow:0 6px 24px rgba(0,0,0,.15)}
@media (prefers-color-scheme:light){:root[data-theme=system]{--bg:#f4f6fa;--card:#fff;--card2:#eef1f6;--text:#161a22;--muted:#5b6575;--accent:#0e9f6e;--accent-ink:#fff;--danger:#d93a3a;--warn:#b7791f;--line:#dde2ea;--shadow:0 6px 24px rgba(0,0,0,.15)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(12px + env(safe-area-inset-top)) 16px 96px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:20px 0 8px}h3{font-size:15px;margin:0 0 4px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.row.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:22px;line-height:1.2}.stat span{font-size:12px;color:var(--muted)}
button,.btn{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:14px;min-height:48px;min-width:48px;padding:0 16px;cursor:pointer;transition:transform .08s,filter .08s}
button:active,.btn:active{transform:scale(.97);filter:brightness(1.2)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.danger{color:var(--danger)}
.block{width:100%}
.chip{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border-radius:24px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
label.f{display:block;margin:12px 0}label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:0 12px;width:100%}
input[type=range]{padding:0;accent-color:var(--accent)}
.stepper{display:flex;gap:8px}.stepper input{text-align:center;flex:1;min-width:0}.stepper button{flex:0 0 52px;padding:0;font-size:22px}
details{margin-top:8px}summary{cursor:pointer;min-height:32px;color:var(--muted);font-size:13px;list-style:none}
summary::-webkit-details-marker{display:none}summary::before{content:"ⓘ  "}
details[open] summary{color:var(--text)}
.why{font-size:13px;color:var(--muted);background:var(--card2);border-radius:10px;padding:8px 10px;margin-top:6px}
.why div{margin:2px 0}.why code{color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.banner{border-left:4px solid var(--warn)}
.note{border-left:4px solid var(--accent)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20;max-width:640px;margin:0 auto}
nav button{flex:1;border:0;border-radius:0;background:transparent;min-height:60px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
nav button span{font-size:20px;line-height:1}nav button.on{color:var(--accent);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;min-height:56px;padding:0 22px;border-radius:28px;box-shadow:var(--shadow);font-size:16px}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:31;padding:8px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .22s ease;box-shadow:var(--shadow)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 10px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;max-width:608px;margin:0 auto;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px;display:none;align-items:center;justify-content:space-between;gap:8px;box-shadow:var(--shadow)}
#toast.on{display:flex}
.chartwrap{display:flex;background:var(--card2);border-radius:12px;overflow:hidden}.chartwrap .axis{flex:0 0 38px}.chartbox{flex:1;min-width:0;overflow-x:auto;overflow-y:hidden}
.chartbox svg{display:block}
.readout{min-height:22px;font-size:13px;margin:6px 0}
.item{position:relative;overflow:hidden;border-radius:12px;margin:6px 0;background:var(--danger)}
.item>.in{position:relative;background:var(--card2);padding:10px 12px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;touch-action:pan-y;transition:transform .15s}
.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.err{color:var(--danger);font-size:13px;min-height:18px}

.ringb{background:none;border:0;display:flex;flex-direction:column;align-items:center;padding:4px 0;min-height:48px;min-width:0}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rl{font-size:12px;font-weight:600;margin-top:2px}.rs{font-size:11px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}.chips .chip{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line);background:var(--card2);color:var(--text)}
.chips .chip.primary{background:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px;vertical-align:middle;background:var(--card2);color:var(--muted)}
.pill.good{background:rgba(61,220,151,.18);color:var(--accent)}.pill.warn{background:rgba(245,192,74,.18);color:var(--warn)}.pill.bad{background:rgba(255,107,107,.18);color:var(--danger)}
.micro{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mc{background:var(--card2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;font-size:13px}.mc span{color:var(--muted);font-size:12px}.mc.light{border-left:3px solid var(--warn)}
.insight{border-left:4px solid var(--accent)}
.info{background:none;border:0;font-size:20px;color:var(--accent);padding:0;min-width:48px}
.exc{padding:10px}.exhead{background:none;border:0;text-align:left;flex:1;min-width:0;padding:4px 6px;font:inherit;color:var(--text)}
.nextchip{display:block;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:18px;border:0;border-radius:14px;padding:12px 14px;margin:8px 0;min-height:56px}
.nextchip .small{font-weight:500;opacity:.8}
.setrow{background:var(--card2);border-radius:14px;padding:8px;margin:8px 0}.setrow summary::before{content:'✎  '}.row>button.small{flex:0 0 auto}.setrow.done{outline:2px solid var(--accent)}
.setrow select.rpe{width:150px;min-height:48px;padding:0 6px}
.chk{width:56px;font-size:24px;padding:0}.chk.on{background:var(--accent);color:var(--accent-ink)}
#restBar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;z-index:25;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:6px 10px;display:none;align-items:center;justify-content:space-between;gap:8px;box-shadow:var(--shadow);overflow:hidden;font-size:16px}
#restBar.on{display:flex}body.resting main{padding-bottom:150px}body.resting #toast{bottom:calc(138px + env(safe-area-inset-bottom))}body.resting .fab{bottom:calc(138px + env(safe-area-inset-bottom))}#restBar button{min-height:48px;padding:0 12px}
#restBar i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}
.tbl{border-collapse:collapse;width:100%;font-size:14px}.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
textarea{font:inherit}
.item>.in[data-act]{cursor:pointer}
@media (orientation:landscape) and (max-height:500px){nav button{min-height:48px;flex-direction:row;justify-content:center;gap:6px}main{padding-bottom:72px}.fab{bottom:calc(60px + env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<div id="app"><main id="main" tabindex="-1"></main></div>
<nav id="tabs" aria-label="Main"></nav>
<div id="backdrop"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="restBar" role="timer" aria-live="off"></div>
<div id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
// EXTENSION POINTS: Store (swap storage backend), migrate() (schema upgrades), record.source ("manual" → future imports), pure Calc functions (no DOM), versioned EXPORT FORMAT below.
'use strict';

/* ===========================================================================
 * EXPORT FORMAT (schemaVersion 2) — a companion script may write the same shape and import it:
 * {
 *   "app": "on-device-fitness", "schemaVersion": 2, "exportedAt": ISO timestamp,
 *   "settings": { units:{weight:"kg|lb",height:"cm|in",volume:"ml|oz"}, theme, plateInc(kg), stepGoal, waterMlPerKg, ... },
 *   "profile":  { age, sex:"male|female", heightCm, goal:"cut|maintain|lean_bulk|recomp", activity, calAdjPct:number|null, proteinPerKg } | null,
 *   "metrics":  [ { id, type:"weight|bodyfat|water|steps", date:"YYYY-MM-DD", value (kg | % | ml | steps), source:"manual", createdAt, updatedAt } ],
 *   "entries":  food log [ { id, date, meal, name, accuracy:"exact|good|rough", kcal, protein, carbs, fat, fiber, sodium(mg), addedSugar, naturalSugar, flags[], source, createdAt, updatedAt } ],
 *   "customFoods", "savedMeals", "customExercises", "splits" [ { id, name, days:[{dow 0-6 (Mon=0), name, rest, exercises:[{exId, sets, repMin, repMax}]}] } ],
 *   "sessions": [ { id, date, dayName, status:"active|done", sets:[{id, exId, weight(kg), reps, rpe, note, done, source, createdAt, updatedAt}] } ]
 * }
 * All values are metric. Time-based metrics are simple dated entries so imported data can slot in.
 * CONFLICT RULE (documented, not built): if imported and manual values exist for the same metric and day, the manual value wins.
 * =========================================================================== */

/* ------------------------------ Storage layer ------------------------------ */
const SCHEMA_VERSION = 2;
const COLLS = ['metrics', 'entries', 'customFoods', 'savedMeals', 'splits', 'customExercises', 'sessions'];
const SETTING_DEFAULTS = {
  theme: 'dark', lastBackupAt: null, plateInc: 2.5, wakeLock: true, stepGoal: 8000, stepKcalPerKgStep: 0.0005, useStepsInTdee: false,
  waterMlPerKg: 35, waterTrainingBonus: 500, sodiumLo: 1500, sodiumHi: 2300, addedSugarLimit: null, sessionMinutes: 60,
  currentSplitId: null, targetSplitId: null, workoutPrompted: false, exLinks: {}, favFoods: [], dismissed: {}, flaggedJoints: [], restSeconds: 120
};
const MIGRATIONS = {
  1: d => { COLLS.forEach(c => { d[c] = d[c] || []; }); return d; } // v1 → v2: food, workout and steps/water collections
};

function migrate(data) {
  let v = Number(data.schemaVersion) || 1;
  while (v < SCHEMA_VERSION) { if (MIGRATIONS[v]) data = MIGRATIONS[v](data); v++; }
  data.schemaVersion = SCHEMA_VERSION;
  return data;
}

const Store = (() => {
  const KEY = 'fitness.data';
  let mem = null, storageOk = true;
  const defaults = () => {
    const d = { schemaVersion: SCHEMA_VERSION, settings: Object.assign({}, JSON.parse(JSON.stringify(SETTING_DEFAULTS)),
      { units: { weight: 'kg', height: 'cm', volume: 'ml' }, createdAt: new Date().toISOString() }), profile: null };
    COLLS.forEach(c => { d[c] = []; });
    return d;
  };
  function normalize(d) {
    const base = defaults();
    d.settings = Object.assign(base.settings, d.settings || {});
    d.settings.units = Object.assign(base.settings.units, (d.settings || {}).units || {});
    d.profile = d.profile || null;
    COLLS.forEach(c => { d[c] = Array.isArray(d[c]) ? d[c] : []; });
    return d;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(mem)); storageOk = true; }
    catch (e) { storageOk = false; }
    return storageOk;
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      mem = raw ? normalize(migrate(JSON.parse(raw))) : defaults();
    } catch (e) { mem = defaults(); }
    return mem;
  }
  load();
  return {
    get: () => mem,
    isOk: () => storageOk,
    save(mutator) { mutator(mem); return persist(); },
    list(coll, type) { return type ? mem[coll].filter(r => r.type === type) : mem[coll]; },
    byId(coll, id) { return mem[coll].find(r => r.id === id) || null; },
    put(coll, rec) {                        // insert or update by id
      const i = mem[coll].findIndex(r => r.id === rec.id);
      if (i >= 0) mem[coll][i] = rec; else mem[coll].push(rec);
      return persist();
    },
    del(coll, id) { mem[coll] = mem[coll].filter(r => r.id !== id); return persist(); },
    replaceAll(data) { mem = normalize(migrate(data)); return persist(); },
    reset() { mem = defaults(); return persist(); },
    exportObject() {
      const o = { app: 'on-device-fitness', schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(), settings: mem.settings, profile: mem.profile };
      COLLS.forEach(c => { o[c] = mem[c]; });
      return o;
    }
  };
})();

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const nowISO = () => new Date().toISOString();
/** Every record: unique id, createdAt/updatedAt, source ("manual" for now). */
function stamp(rec) { return Object.assign({ id: uid(), source: 'manual', createdAt: nowISO(), updatedAt: nowISO() }, rec); }
function newRecord(type, date, value) { return stamp({ type, date, value }); }
/** One dated entry per metric type per day (weight, bodyfat, steps); logging again the same day updates it. */
function logMetric(type, date, value) {
  const ex = Store.list('metrics', type).find(r => r.date === date);
  if (ex) return Store.put('metrics', Object.assign({}, ex, { value, updatedAt: nowISO() }));
  return Store.put('metrics', newRecord(type, date, value));
}
const METRIC_TYPES = ['weight', 'bodyfat', 'water', 'steps'];
function validateImport(d) {
  if (!d || typeof d !== 'object') return 'Not a JSON object.';
  if (d.app !== 'on-device-fitness') return 'This file is not an On-Device Fitness backup.';
  if (typeof d.schemaVersion !== 'number') return 'Missing schemaVersion.';
  if (d.schemaVersion > SCHEMA_VERSION) return 'This backup is from a newer version of the app.';
  for (const c of COLLS) if (d[c] != null && !Array.isArray(d[c])) return c + ' must be a list.';
  for (const m of d.metrics || []) {
    if (!m || !m.id || !METRIC_TYPES.includes(m.type) || !/^\d{4}-\d{2}-\d{2}$/.test(m.date) || !isFinite(m.value)) return 'A metric entry is malformed.';
  }
  for (const c of COLLS.slice(1)) for (const r of d[c] || []) if (!r || !r.id) return 'An entry in ' + c + ' has no id.';
  return null;
}

/* ---------------------- Pure calculations (no DOM access) ---------------------- */
const ACTIVITY = {
  sedentary: { f: 1.2,   label: 'Sedentary',        hint: 'desk job, little exercise' },
  light:     { f: 1.375, label: 'Lightly active',   hint: 'exercise 1–3 days/week' },
  moderate:  { f: 1.55,  label: 'Moderately active', hint: 'exercise 3–5 days/week' },
  very:      { f: 1.725, label: 'Very active',      hint: 'hard exercise 6–7 days/week' },
  athlete:   { f: 1.9,   label: 'Extremely active', hint: 'physical job + daily training' }
};
const GOALS = {
  cut:       { label: 'Cut',       pct: -17.5, range: '−15 to −20%' },
  maintain:  { label: 'Maintain',  pct: 0,     range: '0%' },
  lean_bulk: { label: 'Lean bulk', pct: 7.5,   range: '+5 to +10%' },
  recomp:    { label: 'Recomp',    pct: -5,    range: 'about −5%' }
};
const KCAL_PER_KG = 7700; // common approximation for 1 kg of body weight change
const r0 = n => Math.round(n), r1 = n => Math.round(n * 10) / 10, r2 = n => Math.round(n * 100) / 100;

const Calc = {
  dayNum: s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; },

  bmr(p, weightKg, bfPct) {
    if (bfPct != null && isFinite(bfPct)) {
      const lbm = weightKg * (1 - bfPct / 100);
      const kcal = 370 + 21.6 * lbm;
      return { kcal, method: 'Katch-McArdle', why: [
        `Body fat is entered, so Katch-McArdle is used (it accounts for lean mass).`,
        `Lean mass = ${r1(weightKg)} kg × (1 − ${r1(bfPct)}%) = <code>${r1(lbm)} kg</code>`,
        `BMR = 370 + 21.6 × ${r1(lbm)} = <code>${r0(kcal)} kcal</code>`,
        `Body fat is an estimate from wrist BIA, so treat this as ± ~100 kcal.`] };
    }
    const kcal = 10 * weightKg + 6.25 * p.heightCm - 5 * p.age + (p.sex === 'male' ? 5 : -161);
    return { kcal, method: 'Mifflin-St Jeor', why: [
      `No body fat entered, so Mifflin-St Jeor is used.`,
      `BMR = 10 × ${r1(weightKg)} kg + 6.25 × ${r0(p.heightCm)} cm − 5 × ${p.age} y ${p.sex === 'male' ? '+ 5' : '− 161'} = <code>${r0(kcal)} kcal</code>`] };
  },

  /** stepKcal: optional extra kcal/day from steps/training (null = not used). */
  tdee(bmr, activityKey, stepKcal) {
    const f = ACTIVITY[activityKey].f;
    let kcal = bmr * f;
    const why = [`TDEE = BMR × activity factor = ${r0(bmr)} × ${f} (${ACTIVITY[activityKey].label.toLowerCase()}) = <code>${r0(kcal)} kcal</code>`];
    if (stepKcal) { kcal += stepKcal; why.push(`+ ${r0(stepKcal)} kcal from steps/training adjustment = <code>${r0(kcal)} kcal</code>`); }
    why.push(`Activity factors are rough averages; real expenditure varies by person.`);
    return { kcal, why };
  },

  calorieTarget(tdee, goal, pctOverride) {
    const pct = pctOverride != null ? pctOverride : GOALS[goal].pct;
    const kcal = tdee * (1 + pct / 100);
    return { kcal, pct, why: [
      `Goal: ${GOALS[goal].label} (typical range ${GOALS[goal].range}).`,
      `Adjustment used: <code>${pct > 0 ? '+' : ''}${pct}%</code>${pctOverride != null ? ' (your custom value)' : ' (default for this goal)'}`,
      `Target = ${r0(tdee)} × (1 ${pct < 0 ? '−' : '+'} ${Math.abs(pct) / 100}) = <code>${r0(kcal)} kcal</code>`] };
  },

  macros(kcal, weightKg, proteinPerKg) {
    const protein = proteinPerKg * weightKg;
    const fatFloor = 0.6 * weightKg, fatPct = 0.25 * kcal / 9;
    const fat = Math.max(fatFloor, fatPct);
    let carbs = (kcal - protein * 4 - fat * 9) / 4;
    const squeezed = carbs < 0; if (squeezed) carbs = 0;
    const fiber = 14 * kcal / 1000;
    return {
      protein: { g: protein, why: [`Protein = ${proteinPerKg} g/kg × ${r1(weightKg)} kg = <code>${r0(protein)} g</code> (${r0(protein * 4)} kcal).`, `Common evidence-based range is 1.6–2.2 g/kg; default 2.0.`] },
      fat: { g: fat, why: [`Fat = the larger of 0.6 g/kg (${r0(fatFloor)} g) and 25% of calories (${r0(fatPct)} g) = <code>${r0(fat)} g</code> (${r0(fat * 9)} kcal).`] },
      carbs: { g: carbs, why: [`Carbs fill the remainder: (${r0(kcal)} − ${r0(protein * 4)} protein kcal − ${r0(fat * 9)} fat kcal) ÷ 4 = <code>${r0(carbs)} g</code>.`].concat(squeezed ? [`Calories are too low to fit protein and fat; carbs are floored at 0. You might consider a smaller deficit or lower protein.`] : []) },
      fiber: { g: fiber, why: [`Fiber ≈ 14 g per 1,000 kcal = 14 × ${r2(kcal / 1000)} = <code>${r0(fiber)} g</code>.`] }
    };
  },

  /** Calendar-based 7-day moving average. entries: [{date, value}] → [{date, value, ma}] sorted. */
  movingAvg(entries, window = 7) {
    const s = entries.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(e => ({ date: e.date, value: e.value, n: Calc.dayNum(e.date) }));
    return s.map(e => {
      const w = s.filter(x => x.n <= e.n && x.n > e.n - window);
      return { date: e.date, value: e.value, ma: w.reduce((a, x) => a + x.value, 0) / w.length };
    });
  },

  /** Least-squares slope of the moving average over the last `days` days, in kg/week. null if not enough data. */
  trendPerWeek(series, days = 14) {
    if (series.length < 2) return null;
    const last = Calc.dayNum(series[series.length - 1].date);
    const pts = series.filter(p => Calc.dayNum(p.date) >= last - days).map(p => [Calc.dayNum(p.date), p.ma]);
    if (pts.length < 3) return null;
    const n = pts.length, mx = pts.reduce((a, p) => a + p[0], 0) / n, my = pts.reduce((a, p) => a + p[1], 0) / n;
    const den = pts.reduce((a, p) => a + (p[0] - mx) ** 2, 0);
    return den ? 7 * pts.reduce((a, p) => a + (p[0] - mx) * (p[1] - my), 0) / den : null;
  },

  /** Suggested review once ≥14 days of weight data: actual trend vs. what the calorie target implies. */
  trendReview(series, tdeeKcal, targetKcal) {
    if (series.length < 3) return null;
    const span = Calc.dayNum(series[series.length - 1].date) - Calc.dayNum(series[0].date);
    if (span < 14) return { ready: false, daysLeft: Math.ceil(14 - span) };
    const actual = Calc.trendPerWeek(series, 14);
    if (actual == null) return { ready: false, daysLeft: 0 };
    const expected = (targetKcal - tdeeKcal) * 7 / KCAL_PER_KG;
    const diff = actual - expected;
    const kcalGap = diff * KCAL_PER_KG / 7;
    return { ready: true, actual, expected, diff, kcalGap, onTrack: Math.abs(diff) < 0.15,
      why: [`Actual: slope of your 7-day average over the last 14 days = <code>${r2(actual)} kg/week</code>.`,
            `Expected: (${r0(targetKcal)} − ${r0(tdeeKcal)}) kcal/day × 7 ÷ ${KCAL_PER_KG} kcal/kg = <code>${r2(expected)} kg/week</code>.`,
            `Within ±0.15 kg/week counts as "on track". Otherwise gap ${r2(diff)} kg/week × ${KCAL_PER_KG} ÷ 7 ≈ <code>${r0(Math.abs(kcalGap))} kcal/day</code> difference.`] };
  },

  /** Full target set from raw inputs. Returns null if inputs are incomplete. */
  targets(profile, weightKg, bfPct, stepKcal) {
    if (!profile || !weightKg) return null;
    const bmr = Calc.bmr(profile, weightKg, bfPct);
    const tdee = Calc.tdee(bmr.kcal, profile.activity, stepKcal);
    const cal = Calc.calorieTarget(tdee.kcal, profile.goal, profile.calAdjPct);
    const macros = Calc.macros(cal.kcal, weightKg, profile.proteinPerKg || 2.0);
    return { bmr, tdee, cal, macros };
  }
};

const NUTS = ['kcal', 'protein', 'carbs', 'fat', 'fiber', 'sodium', 'addedSugar', 'naturalSugar'];
const ACC = { exact: 0, good: 0.10, rough: 0.25 };
const MEALS = ['breakfast', 'lunch', 'dinner', 'snack'];
const roundTo = (x, inc) => Math.round(Math.round(x / inc) * inc * 1000) / 1000;

Object.assign(Calc, {
  /** Nutrients for `grams` of a food (food.per100 is per 100 g). */
  scaleFood(food, grams) {
    const o = {}; NUTS.forEach(k => { o[k] = Math.round(food.per100[k] * grams / 100 * 10) / 10; });
    return o;
  },
  /** Day totals: {k: {v, lo, hi}}. "good guess" = ±10%, "rough" = ±25%, "exact" = ±0. */
  dayTotals(entries) {
    const t = {}; NUTS.forEach(k => { t[k] = { v: 0, lo: 0, hi: 0 }; });
    let rough = 0;
    entries.forEach(e => {
      const a = ACC[e.accuracy] != null ? ACC[e.accuracy] : 0; if (a) rough++;
      NUTS.forEach(k => { const v = e[k] || 0; t[k].v += v; t[k].lo += v * (1 - a); t[k].hi += v * (1 + a); });
    });

    return t;
  },
  waterTarget(weightKg, mlPerKg, training, bonus) {
    const base = weightKg * mlPerKg, ml = base + (training ? bonus : 0);

  },
  sodiumStatus(mg, lo, hi) { return mg < lo ? 'low' : mg > hi ? 'high' : 'in range'; },
  addedSugarLimit(sex, override) { return override != null ? override : (sex === 'female' ? 25 : 36); },
  stepKcal(steps, weightKg, factor) { return steps * weightKg * factor; },

  /** Light/ok per micronutrient tag over the last 7 days, based on how many logged days contained a tagged food. */
  microCoverage(dayList) { // dayList: [{date, flags:Set|array}] days with ≥1 entry
    const n = dayList.length, out = [];
    Object.keys(FLAG_NAMES).forEach(f => {
      const days = dayList.filter(d => d.flags.includes(f)).length;
      out.push({ flag: f, name: FLAG_NAMES[f], days, of: n, light: n >= 3 && days / n < 0.5 });

  },
  /** Suggest up to 3 foods (one medium portion each) that help close gaps and fit remaining calories. */
  suggestFoods(remaining, lightFlags, foods) {
    const room = remaining.kcal;
    if (room <= 80) return [];
    return foods.map(f => {
      const g = f.portions.medium, n = Calc.scaleFood(f, g);
      if (n.kcal > room) return null;
      let score = 0, why = [];
      const p = Math.min(n.protein, Math.max(0, remaining.protein));
      if (p >= 8) { score += p * 1.2; why.push(`${r0(n.protein)} g protein`); }
      const fib = Math.min(n.fiber, Math.max(0, remaining.fiber));
      if (fib >= 3) { score += fib * 3; why.push(`${r0(n.fiber)} g fiber`); }

      if (fl.length) { score += fl.length * 8; why.push(fl.map(x => FLAG_NAMES[x]).join(', ') + ' (light this week)'); }

  exerciseHistory(sessions, exId) {

  /** Double progression. hist: oldest→newest. */

    }

    const reps = Math.min(repMax, minReps + bump);
    return { weight: topW, reps, kind: 'reps', why: [base, `Not all sets hit ${repMax} reps yet, so keep ${topW} kg and aim for +${bump} rep${bump > 1 ? 's' : ''} (${reps})${bump === 2 ? ' — RPE ≤ 7 suggests there is room' : ''}.`] };

  },
  stallOptions(hist, inc, variation) {

  },
  /** Fatigue pattern: several lifts regressing >3% vs their previous session, recently. */
  fatigue(histories, today) { // histories: [{ex, hist}]

  /** Weekly hard sets per muscle: primary = 1 set, secondary = 0.5 set. */
  weeklyHardSets(sessions, getEx, today, days = 7) {

    sessions.filter(s => Calc.dayNum(today) - Calc.dayNum(s.date) < days).forEach(se => se.sets.filter(Calc.isHard).forEach(s => {

  matchExercise(name, list) {

      4: { name: 'Upper / Lower ×2', dows: [0, 1, 3, 4], types: ['UPPER', 'LOWER', 'UPPER', 'LOWER'], why: '4 days of Upper/Lower hits each muscle twice weekly with manageable session length.' },
      5: { name: 'Upper / Lower + Push / Pull / Legs', dows: [0, 1, 3, 4, 5], types: ['UPPER', 'LOWER', 'PUSH', 'PULL', 'LEGS'], why: '5 days: Upper/Lower early in the week then PPL, so most muscles get ~2 hits.' },
      6: { name: 'Push / Pull / Legs ×2', dows: [0, 1, 2, 4, 5, 6], types: ['PUSH', 'PULL', 'LEGS', 'PUSH', 'PULL', 'LEGS'], why: '6 days of PPL gives high frequency and volume — best for experienced lifters with good recovery.' }
    };
    const n = Math.min(6, Math.max(2, Math.round(form.days) || 3)), L = LAYOUT[n];
    const NAMES = { FULL_A: 'Full Body A', FULL_B: 'Full Body B', UPPER: 'Upper', LOWER: 'Lower', PUSH: 'Push', PULL: 'Pull', LEGS: 'Legs' };
    const perEx = form.experience === 'beginner' ? 3 : 3.3;
    const count = Math.max(3, Math.min(8, Math.round((form.minutes - 8) / (perEx * 2.5))));
    const days = [], reasons = []; let wk = 0;
    for (let d = 0; d < 7; d++) days.push({ dow: d, name: 'Rest', rest: true, exercises: [] });
    const typeCount = {};
    L.types.forEach((type, idx) => {
      typeCount[type] = (typeCount[type] || 0) + 1;
      const used = new Set(), exs = [];
      SLOTS[type].forEach(([label, ids]) => {
        if (exs.length >= count) return;
        const e = pick(ids.filter(i => !used.has(i)));
        if (!e) return; used.add(e.id);
        let sets = form.experience === 'beginner' ? 3 : (e.compound && exs.length < 2 ? 4 : 3);
        if (form.experience === 'advanced' && exs.length < 2) sets = 4;
        let lo = 8, hi = 12;
        if (form.experience !== 'beginner') {
          if (e.compound && exs.length < 2) { lo = 5; hi = 8; } else if (e.compound) { lo = 8; hi = 12; } else if (e.muscle === 'calves' || e.id === 'lateral' || e.id === 'reardelt') { lo = 12; hi = 20; } else { lo = 10; hi = 15; }
        }
        exs.push({ exId: e.id, sets, repMin: lo, repMax: hi, reason: `${label}: ${e.name}` + (e.compound ? ' (compound first)' : '') });
      });
      const dayName = NAMES[type] + (typeCount[type] > 1 && L.types.filter(t => t === type).length > 1 && !/^FULL/.test(type) ? ' ' + typeCount[type] : '');
      days[L.dows[idx]] = { dow: L.dows[idx], name: dayName, rest: false, exercises: exs };
      reasons.push({ day: dayName, text: `${exs.length} exercises to fit ~${form.minutes} min (≈ ${r0(exs.reduce((a, x) => a + x.sets, 0) * 2.5 + 5)} min).` });
    });
    return { name: L.name, why: L.why + (joints.length ? ` Exercises stressing your ${joints.join('/')} were left out.` : ''), days, reasons };
  },

  /* ---- workout review (suggestions only) ---- */
  estMinutes: day => day.exercises.reduce((a, x) => a + x.sets * 2.5, 5),
  reviewSplit(split, getEx, pool, opts) {
    const out = [];
    const trainDays = split.days.map((d, i) => ({ d, i })).filter(x => !x.d.rest && x.d.exercises.length);
    const okEquip = e => (opts.kinds || ['gym', 'db', 'bw']).includes(EQUIP_KIND[e.equip] || 'bw');
    const inSplit = new Set(trainDays.flatMap(x => x.d.exercises.map(e => e.exId)));
    const lightestDay = muscle => {
      const hit = trainDays.map(x => ({ i: x.i, n: x.d.exercises.filter(e => (getEx(e.exId) || {}).muscle === muscle).length, len: x.d.exercises.length }));
      return hit.sort((a, b) => a.n - b.n || a.len - b.len)[0];
    };
    const candidates = (pred, n = 3) => pool.filter(e => okEquip(e) && !inSplit.has(e.id) && pred(e) && !e.stress.some(j => (opts.joints || []).includes(j))).slice(0, n);
    const addSwaps = (cands, dayIdx) => cands.map(e => ({ label: `Add ${e.name} (3×${e.compound ? '8-12' : '10-15'})`, action: { type: 'add', dayIndex: dayIdx, exId: e.id, sets: 3, repMin: e.compound ? 8 : 10, repMax: e.compound ? 12 : 15 }, reason: `${e.name} trains ${e.muscle}${e.compound ? ' with a compound movement' : ''}.` }));
    if (!trainDays.length) return [];

    // 1. weekly sets & frequency per muscle
    const planned = Calc.plannedSets(split, getEx);
    const MIN = { chest: 10, back: 10, shoulders: 10, quads: 10, hamstrings: 10, glutes: 8, biceps: 6, triceps: 6, calves: 6, core: 6 };
    MUSCLES.forEach(m => {
      const sets = planned[m], low = MIN[m];
      const freq = trainDays.filter(x => x.d.exercises.some(e => { const ex = getEx(e.exId); return ex && (ex.muscle === m || (ex.sec || []).includes(m) && false); })).length;
      if (sets < low) {
        const ld = lightestDay(m);
        out.push({ id: 'vol-' + m, priority: sets === 0 ? 9 : 7, title: `${cap(m)} volume looks low`, data: `${r1(sets)} planned weekly sets (primary = 1, secondary = ½). A common target is ~${MIN[m] === 10 ? '10–20' : MIN[m] + '–12'}.`,
          swaps: addSwaps(candidates(e => e.muscle === m), ld.i) });
      } else if (sets > 20) {
        out.push({ id: 'volhi-' + m, priority: 4, title: `${cap(m)} volume is high`, data: `${r1(sets)} planned weekly sets — above ~20, extra sets often add fatigue faster than gains.`, swaps: [] });
      }
      if (sets >= low && freq === 1 && trainDays.length >= 3) {
        const other = trainDays.filter(x => !x.d.exercises.some(e => (getEx(e.exId) || {}).muscle === m)).sort((a, b) => a.d.exercises.length - b.d.exercises.length)[0];
        out.push({ id: 'freq-' + m, priority: 5, title: `${cap(m)} is trained only once a week`, data: `Hit on 1 of ${trainDays.length} training days. Twice weekly is often more effective for the same total sets.`,
          swaps: other ? addSwaps(candidates(e => e.muscle === m), other.i) : [] });
      }
    });

    // 2. balance
    const patSets = {}; Object.keys(PATTERNS).forEach(p => { patSets[p] = 0; });
    trainDays.forEach(x => x.d.exercises.forEach(e => { const ex = getEx(e.exId); if (ex) patSets[ex.pattern] += e.sets; }));
    const push = patSets.hpush + patSets.vpush, pull = patSets.hpull + patSets.vpull;
    if (push > 0 && push > pull * 1.3) out.push({ id: 'bal-pushpull', priority: 8, title: 'More pushing than pulling', data: `${push} push sets vs ${pull} pull sets per week (ratio ${pull ? r1(push / pull) : '∞'}:1). Roughly 1:1 helps shoulder balance.`, swaps: addSwaps(candidates(e => e.pattern === 'hpull' || e.pattern === 'vpull'), lightestDay('back').i) });
    const quad = planned.quads, post = planned.hamstrings + planned.glutes;
    if (quad > 0 && quad > post * 1.5) out.push({ id: 'bal-quadham', priority: 6, title: 'Quads outweigh hamstrings and glutes', data: `${r1(quad)} quad sets vs ${r1(post)} hamstring + glute sets. Closer to even is usually better for knee and hip health.`, swaps: addSwaps(candidates(e => e.muscle === 'hamstrings' || e.muscle === 'glutes'), lightestDay('hamstrings').i) });

    // 3. missing patterns
    ['hpush', 'vpush', 'hpull', 'vpull', 'squat', 'hinge', 'single', 'core', 'carry'].forEach(p => {
      if (patSets[p] === 0) {
        const cands = candidates(e => e.pattern === p);
        const ld = trainDays.map(x => ({ i: x.i, len: x.d.exercises.length })).sort((a, b) => a.len - b.len)[0];
        out.push({ id: 'pat-' + p, priority: p === 'carry' ? 2 : p === 'single' ? 3 : 6, title: `No ${PATTERNS[p].toLowerCase()} movement`, data: `Your split has 0 sets of ${PATTERNS[p].toLowerCase()}.${cands.length ? ' Options: ' + cands.map(c => c.name).join(' or ') + '.' : ''}`, swaps: addSwaps(cands, ld.i) });
      }
    });

    // 4. order & length
    trainDays.forEach(({ d, i }) => {
      const exs = d.exercises.map(e => ({ e, ex: getEx(e.exId) }));
      const firstIso = exs.findIndex(x => x.ex && !x.ex.compound), lastComp = exs.map(x => x.ex && x.ex.compound).lastIndexOf(true);
      if (firstIso !== -1 && lastComp > firstIso) out.push({ id: 'order-' + i, priority: 4, title: `${d.name}: isolation before compound lifts`, data: `Heavy compounds are usually better done first while you're fresh.`, swaps: [{ label: 'Reorder: compounds first', action: { type: 'reorder', dayIndex: i }, reason: 'Keeps the demanding lifts early in the session.' }] });
      const mins = Calc.estMinutes(d);
      if (d.exercises.length > 8 || (opts.minutes && mins > opts.minutes * 1.1)) {
        const isoIdx = exs.map(x => x.ex && !x.ex.compound).lastIndexOf(true);
        out.push({ id: 'len-' + i, priority: 6, title: `${d.name} may run long`, data: `${d.exercises.length} exercises ≈ ${r0(mins)} min${opts.minutes ? ` vs your ${opts.minutes} min limit` : ''} (estimate: ~2.5 min per set + 5 min warm-up).`, swaps: isoIdx >= 0 ? [{ label: `Remove ${exs[isoIdx].ex.name}`, action: { type: 'remove', dayIndex: i, exIndex: isoIdx }, reason: 'Isolation work is the cheapest thing to trim.' }] : [] });
      }
    });

    // 5. rep variety
    const cats = new Set(); trainDays.forEach(x => x.d.exercises.forEach(e => { const mid = (e.repMin + e.repMax) / 2; cats.add(mid <= 8 ? 'heavy' : mid <= 12 ? 'moderate' : 'light'); }));
    if (cats.size < 2 && trainDays.some(x => x.d.exercises.length >= 4)) {
      const iso = trainDays.flatMap(x => x.d.exercises.map((e, k) => ({ e, k, i: x.i, ex: getEx(e.exId) }))).filter(x => x.ex && !x.ex.compound)[0];
      const comp = trainDays.flatMap(x => x.d.exercises.map((e, k) => ({ e, k, i: x.i, ex: getEx(e.exId) }))).filter(x => x.ex && x.ex.compound)[0];
      const sw = [];
      if (comp) sw.push({ label: `${comp.ex.name} → 5–8 reps (heavy)`, action: { type: 'reps', dayIndex: comp.i, exIndex: comp.k, repMin: 5, repMax: 8 }, reason: 'A heavy compound builds strength.' });
      if (iso) sw.push({ label: `${iso.ex.name} → 12–20 reps (light)`, action: { type: 'reps', dayIndex: iso.i, exIndex: iso.k, repMin: 12, repMax: 20 }, reason: 'High-rep isolation work is easier on joints.' });
      out.push({ id: 'reps', priority: 3, title: 'All exercises use one rep range', data: `Every exercise sits in the ${[...cats][0]} range. Mixing heavy (5–8), moderate (8–12) and light (12–20) work is common.`, swaps: sw });
    }

    // 6. rest distribution
    const flags = split.days.map(d => !d.rest && d.exercises.length > 0);
    let run = 0, maxRun = 0; for (let k = 0; k < 14; k++) { if (flags[k % 7]) { run++; maxRun = Math.max(maxRun, Math.min(run, 7)); } else run = 0; }
    if (maxRun >= 4 && flags.filter(Boolean).length < 7) out.push({ id: 'rest', priority: 5, title: `${maxRun} training days in a row`, data: `Rest days spread through the week can help recovery. You might consider a rest day mid-block.`, swaps: [] });
    for (let k = 0; k < 7; k++) {
      const a = split.days[k], b = split.days[(k + 1) % 7]; if (!flags[k] || !flags[(k + 1) % 7]) continue;
      const ma = new Set(a.exercises.map(e => (getEx(e.exId) || {}).muscle)), mb = new Set(b.exercises.map(e => (getEx(e.exId) || {}).muscle));
      const shared = [...ma].filter(m => m && mb.has(m) && ['chest', 'back', 'quads', 'hamstrings', 'shoulders'].includes(m));
      if (shared.length >= 2 && a.name !== b.name) { out.push({ id: 'cons-' + k, priority: 4, title: `${a.name} and ${b.name} overlap on back-to-back days`, data: `Both train ${shared.join(', ')}. Spacing hard sessions for the same muscles ~48 h apart often helps recovery.`, swaps: [] }); break; }
    }

    // 7. joint-friendly alternatives
    (opts.joints || []).forEach(j => {
      trainDays.forEach(({ d, i }) => d.exercises.forEach((e, k) => {
        const ex = getEx(e.exId); if (!ex || !ex.stress.includes(j)) return;
        const alts = pool.filter(a => a.id !== ex.id && okEquip(a) && a.muscle === ex.muscle && !a.stress.includes(j) && !inSplit.has(a.id) && (a.pattern === ex.pattern || a.compound === ex.compound)).slice(0, 3);
        if (alts.length) out.push({ id: `joint-${j}-${i}-${k}`, priority: 9, title: `${ex.name} may bother your ${j}`, data: `You flagged ${j} discomfort. Gentler options for ${ex.muscle}:`, swaps: alts.map(a => ({ label: `Swap to ${a.name}`, action: { type: 'swap', dayIndex: i, exIndex: k, exId: a.id }, reason: `${a.name} loads the ${ex.muscle} with less ${j} stress.` })) });
      }));
    });
    return out.sort((a, b) => b.priority - a.priority).slice(0, 6);
  },
  /** Returns a modified copy of split. */
  applyAction(split, a, getEx) {
    const s = JSON.parse(JSON.stringify(split)), day = s.days[a.dayIndex];
    if (a.type === 'add') day.exercises.push({ exId: a.exId, sets: a.sets, repMin: a.repMin, repMax: a.repMax });
    else if (a.type === 'swap') day.exercises[a.exIndex].exId = a.exId;
    else if (a.type === 'remove') day.exercises.splice(a.exIndex, 1);
    else if (a.type === 'reps') { day.exercises[a.exIndex].repMin = a.repMin; day.exercises[a.exIndex].repMax = a.repMax; }
    else if (a.type === 'reorder') day.exercises.sort((x, y) => ((getEx(y.exId) || {}).compound ? 1 : 0) - ((getEx(x.exId) || {}).compound ? 1 : 0));
    return s;
  },

  /* ---- insights (rules only, max 5) ---- */
  insights(c) {
    const out = [];
    const lastN = (arr, n) => arr.slice(-n);
    // c.days: [{date, t(totals), logged:boolean, steps}] last 7 days oldest→newest
    const logged = c.days.filter(d => d.logged);
    if (c.targets && logged.length >= 3) {
      const low = logged.filter(d => d.t.protein.v < c.targets.macros.protein.g * 0.9);
      if (low.length >= 3) out.push({ key: 'protein', impact: 9, title: 'Protein has been under target', data: `${low.length} of the last ${logged.length} logged days were under 90% of ${r0(c.targets.macros.protein.g)} g (avg ${r0(low.reduce((a, d) => a + d.t.protein.v, 0) / low.length)} g).`, action: 'Try adding one high-protein item to your first meal, e.g. Greek yogurt or eggs.' });
    }
    const naHigh = logged.filter(d => d.t.sodium.v > c.sodiumHi);
    if (naHigh.length >= 3) out.push({ key: 'sodium', impact: 6, title: 'Sodium often above your range', data: `${naHigh.length} days over ${c.sodiumHi} mg in the last week.`, action: 'You might compare labels for one or two salty staples (sauces, bread, processed meat).' });
    const sugHigh = logged.filter(d => d.t.addedSugar.v > c.addedLimit);
    if (sugHigh.length >= 3) out.push({ key: 'sugar', impact: 6, title: 'Added sugar often above your limit', data: `${sugHigh.length} days over ${c.addedLimit} g added sugar.`, action: 'Swapping one sweet drink or snack for a fruit-based option could help.' });
    const st = c.days.filter(d => d.steps != null);
    if (st.length >= 5) {
      const a = st.slice(0, Math.floor(st.length / 2)), b = st.slice(Math.floor(st.length / 2));
      const avg = x => x.reduce((s, d) => s + d.steps, 0) / x.length;
      if (avg(b) < avg(a) * 0.85) out.push({ key: 'steps', impact: 5, title: 'Steps are trending down', data: `Recent avg ${r0(avg(b))} vs earlier ${r0(avg(a))} steps/day.`, action: 'A 10-minute walk after one meal is a small, easy addition.' });
    }
    if (c.weeklySets) MUSCLES.forEach(m => { if (c.hasSessions && c.weeklySets[m] < 6 && !['calves', 'core'].includes(m)) out.push({ key: 'sets-' + m, impact: 4, title: `Low weekly sets for ${m}`, data: `${r1(c.weeklySets[m])} hard sets in the last 7 days.`, action: `Consider adding 2–3 sets for ${m} next session.` }); });
    if (c.review && c.review.ready && !c.review.onTrack) out.push({ key: 'trend', impact: 8, title: 'Weight trend differs from your goal', data: `Trend ${r2(c.review.actual)} kg/week vs ~${r2(c.review.expected)} expected.`, action: `You might shift calories by about ${r0(Math.abs(c.review.kcalGap))} kcal/day and re-check in two weeks.` });
    if (c.fatigue) out.push({ key: 'fatigue', impact: 8, title: 'Several lifts went backwards recently', data: `${c.fatigue.regressions.map(e => e.name).join(', ')} dropped vs last session.`, action: 'A deload week (about 60% volume) plus sleep and food check-ups may help — your call.' });
    if (c.backupDue) out.push({ key: 'backup', impact: 3, title: 'Backup is due', data: 'More than 2 weeks since your last export.', action: 'Settings → Export JSON takes two taps.' });
    return out.filter(i => !c.dismissed[i.key]).sort((a, b) => b.impact - a.impact).slice(0, 5);
  }
});
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

const U = {
  w: () => Store.get().settings.units.weight, h: () => Store.get().settings.units.height, v: () => Store.get().settings.units.volume,
  wToDisp: kg => U.w() === 'lb' ? kg * 2.20462262 : kg,
  wFromDisp: x => U.w() === 'lb' ? x / 2.20462262 : x,
  hToDisp: cm => U.h() === 'in' ? cm / 2.54 : cm,
  hFromDisp: x => U.h() === 'in' ? x * 2.54 : x,
  fw: kg => r1(U.wToDisp(kg)) + ' ' + U.w(),

function todayPlan() { const sp = D.currentSplit(); if (!sp) return null; const d = sp.days[dowToday()]; return d && !d.rest && d.exercises.length ? d : null; }
function isTrainingDay(date) { return D.allSessions().some(s => s.date === date) || (date === todayStr() && !!todayPlan()); }
function shiftDate(date, n) { const [y, m, d] = date.split('-').map(Number); const x = new Date(y, m - 1, d + n); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }
function lastDays(n, end) { const e = end || todayStr(); return Array.from({ length: n }, (_, i) => shiftDate(e, i - n + 1)); }
const dayLabel = d => d === todayStr() ? 'Today' : d === shiftDate(todayStr(), -1) ? 'Yesterday' : fmtDate(d);
function mealNow() { const h = new Date().getHours(); return h < 10 ? 'breakfast' : h < 15 ? 'lunch' : h < 17 ? 'snack' : h < 21 ? 'dinner' : 'snack'; }
const fmtVol = ml => U.v() === 'oz' ? r1(ml / 29.5735) + ' oz' : r0(ml) + ' ml';
const fmtRange = t => t.v === 0 ? '0' : (t.hi - t.lo > 0.5 ? `${r0(t.lo)}–${r0(t.hi)}` : r0(t.v));

function stepKcalAdj() {
  if (!settings().useStepsInTdee) return null;
  const w = latest('weight'); if (!w) return null;
  const vals = lastDays(7).map(D.steps).filter(v => v != null); if (!vals.length) return null;
  return Calc.stepKcal(vals.reduce((a, b) => a + b, 0) / vals.length, w.value, settings().stepKcalPerKgStep);
}
function currentInputs() {
  const p = Store.get().profile, w = latest('weight'), bf = latest('bodyfat');
  return { p, weightKg: w ? w.value : null, bf: bf ? bf.value : null, wDate: w && w.date, bfDate: bf && bf.date };
}
function latest(type) { let b = null; Store.list('metrics', type).forEach(m => { if (!b || m.date > b.date) b = m; }); return b; }
function weightSeries() { return Calc.movingAvg(Store.list('metrics', 'weight').map(m => ({ date: m.date, value: m.value }))); }
function bfSeries() { return Calc.movingAvg(Store.list('metrics', 'bodyfat').map(m => ({ date: m.date, value: m.value }))); }
function getTargets() { const i = currentInputs(); return Calc.targets(i.p, i.weightKg, i.bf, stepKcalAdj()); }
function waterTargetFor(date) {
  const w = latest('weight'), s = settings();
  return Calc.waterTarget(w ? w.value : 70, s.waterMlPerKg, isTrainingDay(date), s.waterTrainingBonus);
}
function sugarLimit() { const p = Store.get().profile; return Calc.addedSugarLimit(p ? p.sex : 'male', settings().addedSugarLimit); }

function backupDue() {
  const s = settings(), st = Store.get();
  if (!st.metrics.length && !st.profile && !st.entries.length) return false;
  return (Date.now() - new Date(s.lastBackupAt || s.createdAt).getTime()) > 14 * 864e5;
}

function render() {
  $('#tabs').innerHTML = TABS.map(([k, ic, lb]) => `<button data-tab="${k}" class="${k === S.tab ? 'on' : ''}" aria-label="${lb}"><span>${ic}</span>${lb}</button>`).join('');
  const views = { today: viewToday, workout: viewWorkout, food: viewFood, trends: viewTrends, settings: viewSettings };
  let html;
  if (S.sub === 'targets') html = viewTargets();
  else if (S.sub === 'session') html = viewSession();
  else if (S.sub === 'exercise') html = viewExerciseHistory(S.arg);
  else if (S.sub === 'split') html = viewSplitEditor(S.arg);
  else if (S.sub === 'review') html = viewReview();
  else html = views[S.tab]();
  const m = $('#main'); m.innerHTML = html;
  document.querySelectorAll('.chartbox').forEach(c => { c.scrollLeft = c.scrollWidth; });
  restTick();
}
function rerender() { const y = $('#main').scrollTop; render(); $('#main').scrollTop = y; }

/* ------------------------------ Shared widgets ------------------------------ */
function ring(label, val, target, text, sub, opt = {}) {
  const R = 34, C = 2 * Math.PI * R, pct = target ? Math.min(val / target, 1) : 0;
  const col = opt.color || 'var(--accent)';
  return `<button class="ringb" data-act="${opt.act || 'noop'}" aria-label="${esc(label)}: ${esc(text)} ${esc(sub || '')}"><svg width="84" height="84" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--card2)" stroke-width="9"/>
    <circle cx="42" cy="42" r="${R}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 42 42)"/>
    <text x="42" y="46" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${esc(text)}</text></svg><span class="rl">${esc(label)}</span><span class="rs">${esc(sub || '')}</span></button>`;
}

const chartData = {};
/** Axis labels live in a fixed column beside the scrolling plot so they never scroll away. */
function chartFrame(plot, ticks, H) {
  return `<div class="chartwrap"><svg class="axis" width="38" height="${H}" viewBox="0 0 38 ${H}">${ticks.map(([y, t]) => `<text x="34" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}</svg><div class="chartbox">${plot}</div></div>`;
}
function lineChart(id, pts, unitFn) {
  if (!pts.length) return '';
  const rows = pts.slice(-120);
  const n0 = Calc.dayNum(rows[0].date), n1 = Calc.dayNum(rows[rows.length - 1].date);
  const W = Math.max(250, (n1 - n0) * 26 + 50), H = 190, L = 22, R = 14, T = 14, B = 26;
  const vals = rows.flatMap(r => [r.value, r.ma]); let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { lo -= .5; hi += .5; } const pad = (hi - lo) * .15; lo -= pad; hi += pad;
  const x = d => L + (n1 === n0 ? (W - L - R) / 2 : (Calc.dayNum(d) - n0) / (n1 - n0) * (W - L - R));
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const ma = rows.map((r, i) => `${i ? 'L' : 'M'}${x(r.date).toFixed(1)},${y(r.ma).toFixed(1)}`).join('');
  let grid = '', ticks = []; for (let k = 0; k <= 3; k++) { const v = lo + (hi - lo) * k / 3; grid += `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`; ticks.push([y(v), r1(unitFn(v))]); }
  const step = Math.max(1, Math.ceil(rows.length / (W / 70)));
  const xl = rows.map((r, i) => i % step === 0 ? `<text x="${x(r.date)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fmtDate(r.date)}</text>` : '').join('');
  chartData[id] = { rows, unitFn, kind: 'line' };
  return chartFrame(`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}${xl}
    <path d="${ma}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${rows.map((r, i) => `<circle cx="${x(r.date)}" cy="${y(r.value)}" r="3.5" fill="var(--text)" opacity=".7"/><circle class="hit" data-chart="${id}" data-i="${i}" cx="${x(r.date)}" cy="${y(r.value)}" r="16" fill="transparent"/>`).join('')}</svg>`, ticks, H)
    + `<div class="readout muted" id="ro-${id}">Tap a point · dots = daily, line = 7-day average</div>`;
}
/** rows: [{label, value}]. target: optional reference line. */
function barChart(id, rows, target, fmt, color) {
  if (!rows.length || rows.every(r => !r.value) && !target) return `<p class="small muted">No data yet.</p>`;
  const W = Math.max(250, rows.length * 34 + 16), H = 170, L = 4, R = 6, T = 12, B = 26;
  const max = Math.max(...rows.map(r => r.value), target || 0, 1) * 1.1;
  const bw = (W - L - R) / rows.length, y = v => T + (1 - v / max) * (H - T - B);
  let grid = '', ticks = []; for (let k = 0; k <= 3; k++) { const v = max * k / 3; grid += `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>`; ticks.push([y(v), fmt(v)]); }
  chartData[id] = { rows, fmt, kind: 'bar', target };
  return chartFrame(`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${grid}
    ${rows.map((r, i) => `<rect x="${L + i * bw + 4}" y="${y(r.value)}" width="${bw - 8}" height="${Math.max(0, H - B - y(r.value))}" rx="4" fill="${color || 'var(--accent)'}" opacity="${r.value ? 1 : .25}"/>
      <text x="${L + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(r.label)}</text>
      <rect class="hit" data-chart="${id}" data-i="${i}" x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`).join('')}
    ${target ? `<line x1="0" x2="${W}" y1="${y(target)}" y2="${y(target)}" stroke="var(--warn)" stroke-dasharray="5 4" stroke-width="1.5"/>` : ''}</svg>`, ticks, H)
    + `<div class="readout muted" id="ro-${id}">Tap a bar${target ? ' · dashed line = target' : ''}</div>`;
}

/* ------------------------------ Today ------------------------------ */
function viewToday() {
  const i = currentInputs(), t = getTargets(), today = todayStr();
  const ent = D.entries(today), tot = Calc.dayTotals(ent), s = settings();
  let h = `<h1>Today <span class="muted small">· ${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}</span></h1>`;
  if (backupDue()) h += `<div class="card banner"><p><b>Back up your data?</b></p><p class="small muted">Browser storage can be cleared. It's been over 2 weeks since your last backup — you might want to export one.</p><button class="block" data-act="export">Export backup</button></div>`;
  if (!i.p) h += `<div class="card note"><p><b>Welcome 👋</b></p><p class="small muted">Everything stays on this device. Set up your profile for daily targets — all adjustable, none of them orders.</p><button class="primary block" data-act="profile">Set up profile</button><button class="block" style="margin-top:8px" data-act="loadSeed">Or try with sample data</button></div>`;
  const wt = waterTargetFor(today), steps = D.steps(today), lim = sugarLimit();
  const st = Calc.sodiumStatus(tot.sodium.v, s.sodiumLo, s.sodiumHi);
  h += `<div class="card"><div class="rings">
    ${ring('Calories', tot.kcal.v, t && t.cal.kcal, r0(tot.kcal.v), t ? 'of ' + r0(t.cal.kcal) : 'no target', { act: 'tabFood' })}
    ${ring('Protein', tot.protein.v, t && t.macros.protein.g, r0(tot.protein.v) + 'g', t ? 'of ' + r0(t.macros.protein.g) + 'g' : '', { act: 'tabFood', color: '#6aa9ff' })}
    ${ring('Water', D.water(today), wt.ml, U.v() === 'oz' ? r0(D.water(today) / 29.5735) : r1(D.water(today) / 1000), 'of ' + (U.v() === 'oz' ? r0(wt.ml / 29.5735) + ' oz' : r1(wt.ml / 1000) + ' L'), { act: 'waterSheet', color: '#4cc3ff' })}
    ${ring('Steps', steps || 0, s.stepGoal, steps == null ? '—' : (steps >= 1000 ? r1(steps / 1000) + 'k' : steps), 'of ' + r1(s.stepGoal / 1000) + 'k', { act: 'stepsSheet', color: '#b48cff' })}
    ${ring('Sodium', tot.sodium.v, s.sodiumHi, r0(tot.sodium.v), st, { act: 'tabFood', color: st === 'high' ? 'var(--danger)' : st === 'low' ? 'var(--warn)' : 'var(--accent)' })}
    ${ring('Added sugar', tot.addedSugar.v, lim, r0(tot.addedSugar.v) + 'g', 'limit ' + lim + 'g', { act: 'tabFood', color: tot.addedSugar.v > lim ? 'var(--danger)' : '#ff8f6b' })}
    </div>${tot.uncertain ? `<p class="tiny muted" style="margin:8px 0 0">Calories today: ${fmtRange(tot.kcal)} (range, since some entries are estimates).</p>` : ''}</div>`;

  // quick-add chips
  const recents = [], seen = new Set();
  Store.list('entries').slice().sort((a, b) => a.createdAt < b.createdAt ? 1 : -1).forEach(e => { if (!seen.has(e.name) && recents.length < 6) { seen.add(e.name); recents.push(e); } });
  const favs = s.favFoods.map(foodById).filter(Boolean).slice(0, 6);
  h += `<div class="chips">
    <button class="chip primary" data-act="waterAdd" data-ml="250">＋250 ml</button><button class="chip primary" data-act="stepsAdd" data-n="1000">＋1000 steps</button>
    ${favs.map(f => `<button class="chip" data-act="quickFav" data-id="${esc(f.id)}">⭐ ${esc(f.name)}</button>`).join('')}
    ${recents.map(e => `<button class="chip" data-act="quickRecent" data-id="${e.id}">↻ ${esc(e.name)}</button>`).join('')}</div>`;

  // workout
  const act = D.active(), plan = todayPlan();
  if (act) h += `<div class="card note"><div class="row sp"><div><h3>Workout in progress</h3><p class="small muted">${esc(act.dayName)} · ${act.sets.filter(x => x.done).length} sets done</p></div><button class="primary" data-act="openSession">Resume</button></div></div>`;
  else if (plan) h += `<div class="card"><div class="row sp"><div><h3>Next workout: ${esc(plan.name)}</h3><p class="small muted">${plan.exercises.length} exercises · ~${r0(Calc.estMinutes(plan))} min</p></div><button class="primary" data-act="startSession" data-dow="${dowToday()}">Start</button></div></div>`;
  else if (D.currentSplit()) h += `<div class="card"><h3>Rest day 😌</h3><p class="small muted">Nothing scheduled today. <a href="#" data-act="tabWorkout" style="color:var(--accent)">Open workout tab</a></p></div>`;
  else h += `<div class="card"><h3>Workout</h3><p class="small muted">No workout set up yet.</p><button class="block" data-act="workoutIntro">Set up workout</button></div>`;

  // insights
  const ins = computeInsights();
  if (ins.length) h += `<h2>Suggestions <span class="muted small">· ideas, not orders</span></h2>` + ins.map(x => `<div class="card insight"><div class="row sp"><h3>${esc(x.title)}</h3><button data-act="dismissInsight" data-key="${esc(x.key)}" aria-label="Dismiss" class="small">✕</button></div><p class="small">${esc(x.data)}</p><p class="small" style="color:var(--accent)">→ ${esc(x.action)}</p></div>`).join('');

  // targets + weight
  if (t) {
    h += `<div class="card"><div class="row sp"><h3>Daily targets <span class="muted small">· ${GOALS[i.p.goal].label}</span></h3><button data-act="targets" class="small">Details</button></div>
      <div class="stat" style="margin:8px 0"><b>${r0(t.cal.kcal)} kcal</b><span>suggested calories</span></div>
      <div class="grid2">${[['Protein', t.macros.protein.g], ['Carbs', t.macros.carbs.g], ['Fat', t.macros.fat.g], ['Fiber', t.macros.fiber.g]].map(([n, v]) => `<div class="stat"><b>${r0(v)} g</b><span>${n}</span></div>`).join('')}</div>${why(t.cal.why)}</div>`;
  }
  if (i.p) {
    const ws = weightSeries(), last = ws[ws.length - 1];
    h += `<div class="card"><div class="row sp"><h3>Weight</h3><span class="muted small">${i.wDate ? (i.wDate === today ? 'logged today' : 'last: ' + fmtDate(i.wDate)) : ''}</span></div>
      <div class="grid2" style="margin:8px 0"><div class="stat"><b>${i.weightKg ? U.fw(i.weightKg) : '—'}</b><span>latest</span></div><div class="stat"><b>${last ? U.fw(last.ma) : '—'}</b><span>7-day average</span></div></div>
      ${i.bf != null ? `<p class="small muted">Body fat (estimated): ${r1(i.bf)}%</p>` : ''}<button class="block" data-act="logWeight">Log weight</button></div>`;
  }
  return h + `<button class="primary fab" data-act="addFood">＋ Add food</button>`;
}

function computeInsights() {
  const t = getTargets(), s = settings(), days = lastDays(7).map(d => ({ date: d, t: Calc.dayTotals(D.entries(d)), logged: D.entries(d).length > 0, steps: D.steps(d) }));
  const sess = D.sessions(), getEx = exById, today = todayStr();
  const hist = []; const exIds = [...new Set(sess.flatMap(x => x.sets.map(y => y.exId)))];
  exIds.forEach(id => { const ex = exById(id); if (ex) hist.push({ ex, hist: Calc.exerciseHistory(sess, id) }); });
  const ws = weightSeries();
  const dismissed = {}; Object.entries(s.dismissed).forEach(([k, d]) => { if (Calc.dayNum(today) - Calc.dayNum(d) < 7) dismissed[k] = true; });
  return Calc.insights({ targets: t, days, sodiumHi: s.sodiumHi, addedLimit: sugarLimit(), hasSessions: sess.length > 0, weeklySets: Calc.weeklyHardSets(sess, getEx, today),
    review: t ? Calc.trendReview(ws, t.tdee.kcal, t.cal.kcal) : null, fatigue: Calc.fatigue(hist, today), backupDue: backupDue(), dismissed });
}

/* ------------------------------ Food ------------------------------ */
function viewFood() {
  const d = S.foodDate, ent = D.entries(d), tot = Calc.dayTotals(ent), t = getTargets(), s = settings(), isToday = d === todayStr();
  let h = `<div class="row sp"><button data-act="foodPrev" aria-label="Previous day">‹</button><h1 style="margin:0">${dayLabel(d)}</h1><button data-act="foodNext" aria-label="Next day" ${isToday ? 'disabled style="opacity:.3"' : ''}>›</button></div>`;
  // totals
  h += `<div class="card"><div class="row sp"><h3>Calories</h3><span class="muted small">${t ? 'target ' + r0(t.cal.kcal) : ''}</span></div>
    <div class="stat" style="margin:8px 0"><b>${fmtRange(tot.kcal)} kcal</b><span>${tot.uncertain ? 'range — some entries are estimates' : 'logged'}</span></div>
    ${tot.uncertain ? why([`Each entry has an accuracy tag: exact = ±0%, good guess = ±10%, rough = ±25%.`, `Low end = sum of (value × (1 − error)), high end = sum of (value × (1 + error)).`, `Midpoint total: <code>${r0(tot.kcal.v)} kcal</code>; range <code>${r0(tot.kcal.lo)}–${r0(tot.kcal.hi)}</code>.`]) : ''}
    <div class="grid2" style="margin-top:8px">${[['Protein', 'protein', 'g'], ['Carbs', 'carbs', 'g'], ['Fat', 'fat', 'g'], ['Fiber', 'fiber', 'g']].map(([n, k, u]) => {
      const tg = t ? (k === 'carbs' ? t.macros.carbs.g : t.macros[k].g) : null;
      return `<div class="stat"><b>${fmtRange(tot[k])}${u}</b><span>${n}${tg ? ' · ' + (tot[k].v >= tg ? 'target reached' : r0(tg - tot[k].v) + 'g to go') : ''}</span></div>`; }).join('')}</div></div>`;
  // water / salt / sugar
  const wt = waterTargetFor(d), wv = D.water(d), na = tot.sodium.v, st = Calc.sodiumStatus(na, s.sodiumLo, s.sodiumHi), lim = sugarLimit();
  h += `<div class="card"><h3>Water · salt · sugar</h3>
    <div class="row sp" style="margin:8px 0"><span>💧 Water</span><b>${fmtVol(wv)} <span class="muted small">/ ${fmtVol(wt.ml)}</span></b></div>
    <div class="bar"><i style="width:${Math.min(100, wv / wt.ml * 100)}%;background:#4cc3ff"></i></div>
    <div class="grid2" style="margin-top:8px;grid-template-columns:repeat(4,1fr)">${[250, 500, 750].map(n => `<button data-act="waterAdd" data-ml="${n}" data-date="${d}" style="padding:0">${U.v() === 'oz' ? r0(n / 29.5735) + ' oz' : n}</button>`).join('')}<button data-act="waterSheet" style="padding:0">Custom</button></div>
    ${why(wt.why)}
    <div class="row sp" style="margin:14px 0 4px"><span>🧂 Sodium</span><b>${r0(na)} mg <span class="pill ${st === 'high' ? 'bad' : st === 'low' ? 'warn' : 'good'}">${st}</span></b></div>
    <p class="small muted">≈ ${r1(na * 2.5 / 1000)} g salt · suggested range ${s.sodiumLo}–${s.sodiumHi} mg${tot.uncertain ? ' · logged amounts are estimates' : ''}</p>
    ${why([`Salt (NaCl) ≈ sodium × 2.5 → ${r0(na)} mg × 2.5 = <code>${r1(na * 2.5 / 1000)} g</code>.`, `"low / in range / high" compares today's total with your range (${s.sodiumLo}–${s.sodiumHi} mg, adjustable in Settings). Low early in the day is normal.`])}
    <div class="row sp" style="margin:14px 0 4px"><span>🍬 Added sugar</span><b>${r0(tot.addedSugar.v)} g <span class="muted small">/ ${lim} g</span></b></div>
    <div class="bar"><i style="width:${Math.min(100, tot.addedSugar.v / lim * 100)}%;background:${tot.addedSugar.v > lim ? 'var(--danger)' : '#ff8f6b'}"></i></div>
    <p class="small muted">Natural sugar (information only): ${r0(tot.naturalSugar.v)} g</p>
    ${why([`Added-sugar limit: ${lim} g/day (${Store.get().profile ? Store.get().profile.sex === 'female' ? 'women' : 'men' : 'men'} default 36 g / 25 g)${s.addedSugarLimit != null ? ' — you set a custom limit' : ''}.`, `Natural sugar from fruit and dairy is shown for information; it is not counted toward the limit.`])}</div>`;
  // meals
  h += `<div class="row sp"><h2 style="margin:12px 0 4px">Meals</h2><button data-act="copyYesterday" class="small">Copy yesterday</button></div>`;
  if (!ent.length) h += `<div class="card empty"><p><b>Nothing logged ${isToday ? 'yet today' : 'this day'}</b></p><p class="small">Tap “Add food” — search the built-in list, pick a portion and you're done in 2–3 taps.</p></div>`;
  MEALS.forEach(m => {
    const list = ent.filter(e => e.meal === m); if (!list.length) return;
    const mt = Calc.dayTotals(list);
    h += `<div class="row sp" style="margin-top:12px"><h3 style="margin:0">${cap(m)} <span class="muted small">· ${fmtRange(mt.kcal)} kcal</span></h3><button class="small" data-act="saveMeal" data-meal="${m}">Save meal</button></div>
      ${list.map(e => `<div class="item" data-del="entry:${e.id}"><div class="in" data-act="editEntry" data-id="${e.id}"><span style="min-width:0"><b>${esc(e.name)}</b><br><span class="small muted">${esc(e.qtyLabel || '')} · ${e.accuracy === 'exact' ? 'exact' : e.accuracy === 'good' ? 'good guess' : 'rough'}${e.flags && e.flags.length ? ' · ' + e.flags.map(f => FLAG_NAMES[f]).join(', ') : ''}</span></span><span style="text-align:right;white-space:nowrap"><b>${r0(e.kcal)}</b> <span class="small muted">kcal</span><br><span class="small muted">P ${r0(e.protein)} · C ${r0(e.carbs)} · F ${r0(e.fat)}</span></span></div></div>`).join('')}`;
  });
  if (ent.length) h += `<p class="tiny muted">Tap to edit · swipe left to delete</p>`;
  h += viewGaps();
  return h + `<button class="primary fab" data-act="addFood">＋ Add food</button>`;
}

function gapData() {
  const t = getTargets(), s = settings(), today = todayStr();
  const days7 = lastDays(7), logged = days7.filter(d => D.entries(d).length);
  const tot = Calc.dayTotals(D.entries(today));
  return { t, s, logged, tot, days7 };
}
function viewGaps() {
  const { t, s, logged, tot, days7 } = gapData();
  const seg = `<div class="seg" style="margin:8px 0">${[['today', 'Today'], ['week', '7-day']].map(([k, l]) => `<button data-act="gapView" data-v="${k}" class="${S.gapView === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  let h = `<h2>What I'm missing</h2><div class="card">${seg}`;
  if (!t) return h + `<p class="small muted">Set up your profile to compare against targets.</p></div>`;
  const rows = [];
  if (S.gapView === 'today') {
    const rem = (k, tg) => tg - tot[k].v;
    rows.push(['Calories', rem('kcal', t.cal.kcal), 'kcal', t.cal.kcal], ['Protein', rem('protein', t.macros.protein.g), 'g', t.macros.protein.g], ['Carbs', rem('carbs', t.macros.carbs.g), 'g', t.macros.carbs.g], ['Fat', rem('fat', t.macros.fat.g), 'g', t.macros.fat.g], ['Fiber', rem('fiber', t.macros.fiber.g), 'g', t.macros.fiber.g]);
    h += rows.map(([n, r, u]) => `<div class="row sp small" style="padding:4px 0"><span>${n}</span><b>${r >= 0 ? r0(r) + ' ' + u + ' remaining' : r0(-r) + ' ' + u + ' over'}</b></div>`).join('');
    const wt = waterTargetFor(todayStr()), rem2 = wt.ml - D.water(todayStr());
    h += `<div class="row sp small" style="padding:4px 0"><span>Water</span><b>${rem2 > 0 ? fmtVol(rem2) + ' remaining' : 'target reached'}</b></div>
      <div class="row sp small" style="padding:4px 0"><span>Sodium</span><b>${Calc.sodiumStatus(tot.sodium.v, s.sodiumLo, s.sodiumHi)} (${r0(tot.sodium.v)} mg)</b></div>
      <div class="row sp small" style="padding:4px 0"><span>Added sugar</span><b>${r0(tot.addedSugar.v)} / ${sugarLimit()} g</b></div>`;
  } else {
    if (!logged.length) h += `<p class="small muted">Log food for a few days to see a weekly view.</p>`;
    else {
      const sums = logged.map(d => Calc.dayTotals(D.entries(d))), avg = k => sums.reduce((a, x) => a + x[k].v, 0) / sums.length;
      const line = (n, k, tg, u) => `<div class="row sp small" style="padding:4px 0"><span>${n}</span><b>${r0(avg(k))} ${u} avg <span class="muted">${tg ? '/ ' + r0(tg) : ''}</span></b></div>`;
      h += `<p class="tiny muted">Average over ${logged.length} logged day${logged.length > 1 ? 's' : ''} of the last 7.</p>` + line('Calories', 'kcal', t.cal.kcal, 'kcal') + line('Protein', 'protein', t.macros.protein.g, 'g') + line('Carbs', 'carbs', t.macros.carbs.g, 'g') + line('Fat', 'fat', t.macros.fat.g, 'g') + line('Fiber', 'fiber', t.macros.fiber.g, 'g') + line('Sodium', 'sodium', s.sodiumHi, 'mg') + line('Added sugar', 'addedSugar', sugarLimit(), 'g');
      const wavg = days7.reduce((a, d) => a + D.water(d), 0) / 7;
      h += `<div class="row sp small" style="padding:4px 0"><span>Water</span><b>${fmtVol(wavg)} avg</b></div>`;
    }
  }
  h += why(['Remaining = target − logged so far. Targets come from the Targets screen.', 'Weekly view averages only days where you logged food, so skipped days do not drag the average down.']);
  // micronutrient heuristic
  const dl = logged.map(d => ({ date: d, flags: [...new Set(D.entries(d).flatMap(e => e.flags || []))] }));
  const cov = Calc.microCoverage(dl);
  h += `<h3 style="margin-top:14px">Micronutrient coverage <span class="pill warn">rough heuristic</span></h3><p class="tiny muted">Based only on food tags (e.g. “calcium-rich”) across the last 7 days — not lab-accurate and not a substitute for a diet review.</p>`;
  if (logged.length < 3) h += `<p class="small muted">Needs at least 3 logged days.</p>`;
  else h += `<div class="micro">${cov.map(c => `<div class="mc ${c.light ? 'light' : ''}"><b>${c.name}</b><span>${c.days}/${c.of} days</span><span>${c.light ? 'light this week' : 'looks covered'}</span></div>`).join('')}</div>`;
  // suggestions
  const remaining = { kcal: t.cal.kcal - tot.kcal.v, protein: t.macros.protein.g - tot.protein.v, fiber: t.macros.fiber.g - tot.fiber.v };
  const sug = Calc.suggestFoods(remaining, cov.filter(c => c.light).map(c => c.flag), allFoods());
  h += `<h3 style="margin-top:14px">Ideas to close the biggest gaps</h3>`;
  if (remaining.kcal <= 80) h += `<p class="small muted">You're near today's calorie target — nothing to add. 🎉</p>`;
  else if (!sug.length) h += `<p class="small muted">No obvious gap-closers that also fit your remaining ${r0(remaining.kcal)} kcal.</p>`;
  else h += sug.map(x => `<div class="item"><div class="in" data-act="addFoodId" data-id="${esc(x.food.id)}"><span style="min-width:0"><b>${esc(x.food.name)}</b><br><span class="small muted">${esc(x.why.join(' · '))}</span></span><span class="small" style="white-space:nowrap">${r0(x.n.kcal)} kcal<br><span class="muted">${x.grams} g</span></span></div></div>`).join('') + `<p class="tiny muted">Suggestions fit your remaining ${r0(remaining.kcal)} kcal. Tap one to log it, or ignore them.</p>`;
  return h + '</div>';
}
